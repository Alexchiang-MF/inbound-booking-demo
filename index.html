<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="以採購單號為 key、餐廳訂位式選時段的進貨預約流程 Demo。資料皆為虛構。">
<meta name="robots" content="noindex">
<title>進貨預約排程台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --ground:#EDEFEC; --surface:#FFFFFF; --surface-2:#F6F7F5; --surface-3:#E4E8E3;
  --ink:#161B19; --ink-2:#5C6663; --ink-3:#89918D;
  --line:#D6DAD5; --line-2:#C2C8C1;
  --primary:#0B4F4A; --primary-ink:#FFFFFF; --primary-soft:#DCEAE7;
  --accent:#D98A14; --accent-soft:#FBEDD4;
  --ok:#2E7D5B; --ok-soft:#DDEEE5;
  --crit:#B03A2E; --crit-soft:#F6DEDA;
  --t-amb:#B07C15; --t-chill:#3E7CA8; --t-frozen:#5A6FB0;
  --shadow:0 1px 2px rgba(22,27,25,.06),0 6px 18px rgba(22,27,25,.05);
  --r:6px;
  --f-display:"Noto Serif TC",Georgia,"Times New Roman",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101413; --surface:#171D1C; --surface-2:#1E2624; --surface-3:#26302E;
    --ink:#E8EDEA; --ink-2:#93A09C; --ink-3:#6E7A77;
    --line:#2A3331; --line-2:#3A4643;
    --primary:#4FB3A6; --primary-ink:#08201E; --primary-soft:#1B3A37;
    --accent:#E8A33C; --accent-soft:#3A2C13;
    --ok:#4FA57D; --ok-soft:#173029;
    --crit:#D2685A; --crit-soft:#3A211D;
    --t-amb:#D2A03E; --t-chill:#6BA6CF; --t-frozen:#8B9BD8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#101413; --surface:#171D1C; --surface-2:#1E2624; --surface-3:#26302E;
  --ink:#E8EDEA; --ink-2:#93A09C; --ink-3:#6E7A77;
  --line:#2A3331; --line-2:#3A4643;
  --primary:#4FB3A6; --primary-ink:#08201E; --primary-soft:#1B3A37;
  --accent:#E8A33C; --accent-soft:#3A2C13;
  --ok:#4FA57D; --ok-soft:#173029;
  --crit:#D2685A; --crit-soft:#3A211D;
  --t-amb:#D2A03E; --t-chill:#6BA6CF; --t-frozen:#8B9BD8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand h1{font-size:17px;letter-spacing:.01em}
.brand .sub{font-size:11px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-mono);margin-top:4px}
.rail-group{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;font-weight:700;padding:14px 8px 5px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:8px 9px;cursor:pointer;color:var(--ink-2);font-weight:500;transition:background .12s,color .12s}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--primary-soft);color:var(--primary);font-weight:700}
.navbtn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
.navbtn[aria-current="true"] .dot{opacity:1}

main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 26px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.clock{display:flex;align-items:baseline;gap:8px}
.clock .t{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:.02em}
.clock .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.clock-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.spacer{flex:1}
.wrap{padding:26px;max-width:1180px;width:100%}
.page-head{margin-bottom:20px}
.page-head h2{font-size:22px}
.page-head p{margin:5px 0 0;color:var(--ink-2);max-width:64ch}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700;font-family:var(--f-mono)}

/* ---------- atoms ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:500;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h3{font-size:15px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);font-weight:500}
input,select{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);min-width:0}
input.mono{font-family:var(--f-mono)}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.n{background:var(--surface-3);color:var(--ink-2)}
.pill.p{background:var(--primary-soft);color:var(--primary)}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.o{background:var(--ok-soft);color:var(--ok)}
.pill.c{background:var(--crit-soft);color:var(--crit)}
.temp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.temp i{width:3px;height:12px;border-radius:2px;display:inline-block}
.t-常溫{background:var(--t-amb)} .t-低溫{background:var(--t-chill)} .t-冷凍{background:var(--t-frozen)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{padding:34px 20px;text-align:center;color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-left:2px solid var(--line-2);padding:9px 13px;border-radius:0 var(--r) var(--r) 0}
.note.warn{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:500}

/* ---------- slot grid ---------- */
.slotgrid{display:flex;flex-direction:column;gap:6px}
.slotrow{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:10px}
.hourlab{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.slots{display:grid;gap:6px}
.slot{position:relative;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 6px 7px;cursor:pointer;text-align:center;transition:border-color .12s,background .12s,transform .1s}
.slot .st{display:block;font-family:var(--f-mono);font-size:13.5px;font-weight:600;letter-spacing:.01em}
.slot .sc{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.slot:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}
.slot.hl{border-color:var(--primary);background:var(--primary-soft)}
.slot.hl .sc{color:var(--primary)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1B1206}
.slot[aria-pressed="true"] .sc{color:#1B1206;opacity:.8}
.slot:disabled{cursor:not-allowed;background:var(--surface-2);border-style:dashed;border-color:var(--line);color:var(--ink-3)}
.slot:disabled .st{text-decoration:line-through;opacity:.55}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;border:1px solid var(--line-2);display:inline-block}

/* ---------- stepper / diff ---------- */
.stepper{display:flex;list-style:none;margin:0 0 18px;padding:0;flex-wrap:wrap;gap:0}
.stepper li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);font-weight:500;padding-right:6px}
.stepper li::after{content:"";width:18px;height:1px;background:var(--line-2);margin:0 12px 0 6px}
.stepper li:last-child::after{display:none}
.stepper i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:12px;flex:none}
.stepper li.now{color:var(--ink);font-weight:700}
.stepper li.now i{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.stepper li.done{color:var(--ink-2)}
.stepper li.done i{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.stepsec{display:flex;align-items:center;gap:10px}
.stepsec b{width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;flex:none;font-weight:600}
.slot.cur{box-shadow:inset 0 0 0 2px var(--primary)}
.slot.cur .sc{color:var(--primary);font-weight:700}
table.diff th{padding:7px 10px}
table.diff td{padding:8px 10px;font-size:13px}
table.diff tr.chg td{background:var(--accent-soft)}
table.diff tr.chg td:last-child{font-weight:700}
table.diff td:first-child{color:var(--ink-2);white-space:nowrap}
.oldval{color:var(--ink-3);text-decoration:line-through}

/* ---------- vehicle picker ---------- */
.vpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.vopt{border:1px solid var(--line-2);border-radius:var(--r);padding:11px 13px;cursor:pointer;background:var(--surface);text-align:left;transition:border-color .12s,background .12s}
.vopt:hover{border-color:var(--primary)}
.vopt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.vopt b{display:block;font-size:14px}
.vopt small{color:var(--ink-2);font-size:11.5px}

/* ---------- dock board ---------- */
.docks{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.dock{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.dock .bar{height:3px;background:var(--line-2)}
.dock.busy .bar{background:var(--primary)}
.dock.called .bar{background:var(--accent)}
.dock.late .bar{background:var(--crit)}
.dock .body{padding:12px 14px}
.dock .dn{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dock .dn b{font-size:14px}
.dock .code{font-family:var(--f-mono);font-size:20px;font-weight:600;letter-spacing:.03em}
.dock .meta{font-size:12px;color:var(--ink-2);margin-top:4px;font-family:var(--f-mono)}
.dock.off{opacity:.5}

/* ---------- queue ---------- */
.qnum{font-family:var(--f-mono);font-size:16px;font-weight:600}
.wait{font-family:var(--f-mono);font-weight:600}
.wait.soon{color:var(--ok)} .wait.long{color:var(--accent)}

/* ---------- ticket ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;overflow-y:auto}
.modal{background:var(--surface);border-radius:8px;max-width:430px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.ticket{padding:22px 24px}
.ticket .th{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.ticket .th .co{font-family:var(--f-display);font-size:15px;font-weight:700}
.ticket .th .co small{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3);font-weight:400}
.ticket .big{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:.02em}
.qrbox{background:#fff;padding:10px;border-radius:var(--r);width:max-content;margin:14px auto 6px;border:1px solid var(--line)}
.qrbox img,.qrbox canvas{display:block}
.rules{font-size:11.5px;color:var(--ink-2);border-top:1px dashed var(--line-2);margin-top:14px;padding-top:11px}
.rules li{margin-bottom:3px}
.rules ol{margin:0;padding-left:18px}

/* ---------- misc ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:13px 15px}
.stat .v{font-family:var(--f-mono);font-size:25px;font-weight:600;line-height:1.15}
.stat .l{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.stat.good .v{color:var(--ok)} .stat.bad .v{color:var(--crit)} .stat.mid .v{color:var(--accent)}
.bar-mini{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px;min-width:70px}
.bar-mini i{display:block;height:100%;background:var(--ok)}
.bar-mini i.mid{background:var(--accent)} .bar-mini i.bad{background:var(--crit)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:99px;font-weight:500;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.chk{width:15px;height:15px;accent-color:var(--primary)}
textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line-2);border-radius:var(--r);padding:10px;background:var(--surface-2);color:var(--ink);resize:vertical}
.openq{border-left:2px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:16px}
.openq b{display:block;font-size:14px}
.openq p{margin:3px 0 0;color:var(--ink-2);font-size:13px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);align-items:center}
  .brand{border-bottom:0;margin:0;padding:0 12px 0 0;flex:none}
  .rail-group{display:none}
  .navbtn{width:auto}
  .wrap{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>進貨預約排程台</h1>
      <div class="sub">TDC Inbound Demo</div>
    </div>
    <div class="rail-group">廠商端</div>
    <button class="navbtn" data-view="book"><i class="dot"></i>採購單預約</button>
    <button class="navbtn" data-view="mine"><i class="dot"></i>預約查詢</button>
    <div class="rail-group">現場端</div>
    <button class="navbtn" data-view="guard"><i class="dot"></i>警衛室過刷</button>
    <button class="navbtn" data-view="board"><i class="dot"></i>碼頭看板</button>
    <div class="rail-group">管理端</div>
    <button class="navbtn" data-view="report"><i class="dot"></i>到場準點報表</button>
    <button class="navbtn" data-view="param"><i class="dot"></i>參數設定</button>
    <div class="rail-group">Demo</div>
    <button class="navbtn" data-view="spec"><i class="dot"></i>規格與待確認</button>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="clock-label">模擬時間</div>
        <div class="clock"><span class="t mono" id="simTime">07:12</span><span class="d mono" id="simDate">2026/09/02 (三)</span></div>
      </div>
      <div class="row" style="gap:6px">
        <button class="btn sm" data-adv="5">＋5 分</button>
        <button class="btn sm" data-adv="15">＋15 分</button>
        <button class="btn sm" data-adv="60">＋1 小時</button>
      </div>
      <div class="spacer"></div>
      <span class="pill a" title="本頁所有廠商、採購單與統計數據皆為虛構">示範資料</span>
      <span class="pill n" id="dcTag">示範物流中心</span>
      <button class="btn sm" id="resetBtn">重設 Demo 資料</button>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div id="layer"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const KEY="tdc-inbound-demo-v3";
const DC={code:"D1",name:"示範物流中心"};

/* ── 時間工具 ───────────────────────────── */
const pad=n=>String(n).padStart(2,"0");
const hhmm=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const toMin=s=>{const[a,b]=s.split(":").map(Number);return a*60+b};
const WD=["日","一","二","三","四","五","六"];
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dshow=s=>{const d=new Date(s+"T00:00:00");return s.replace(/-/g,"/")+" ("+WD[d.getDay()]+")"};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return dstr(d)};

/* ── 預設參數 ───────────────────────────── */
const VTYPES=[
  {id:"small",name:"11 噸以下",span:1,stand:"dock",hint:"靠碼頭下貨，佔 1 個時段"},
  {id:"large",name:"11 噸以上",span:2,stand:"dock",hint:"靠碼頭下貨，佔 2 個連續時段"},
  {id:"wing", name:"鷗翼車",   span:2,stand:"plaza",hint:"廣場下貨，佔 2 個連續時段"}
];
const vt=id=>VTYPES.find(v=>v.id===id);
const STAND={dock:"碼頭",plaza:"廣場"};

function defaultConfig(){
  return{
    callGraceMin:15, waitBufferMin:15,
    warehouses:[
      {id:"N1",name:"常溫 1",temp:"常溫",enabled:true,open:"06:00",close:"12:00",splitPerHour:2,unloadMin:30,
       docks:[{id:"N1-D1",name:"1 號碼頭",type:"dock",enabled:true},{id:"N1-D2",name:"2 號碼頭",type:"dock",enabled:true},
              {id:"N1-D3",name:"3 號碼頭",type:"dock",enabled:true},{id:"N1-D4",name:"4 號碼頭",type:"dock",enabled:false},
              {id:"N1-P1",name:"廣場 1 號位",type:"plaza",enabled:true},{id:"N1-P2",name:"廣場 2 號位",type:"plaza",enabled:true}]},
      {id:"N2",name:"常溫 2",temp:"常溫",enabled:true,open:"07:00",close:"12:00",splitPerHour:3,unloadMin:25,
       docks:[{id:"N2-D1",name:"1 號碼頭",type:"dock",enabled:true},{id:"N2-D2",name:"2 號碼頭",type:"dock",enabled:true},
              {id:"N2-P1",name:"廣場 1 號位",type:"plaza",enabled:true}]},
      {id:"C1",name:"低溫倉",temp:"低溫",enabled:true,open:"06:00",close:"11:00",splitPerHour:2,unloadMin:35,
       docks:[{id:"C1-D1",name:"1 號碼頭",type:"dock",enabled:true},{id:"C1-D2",name:"2 號碼頭",type:"dock",enabled:true},
              {id:"C1-P1",name:"廣場 1 號位",type:"plaza",enabled:true}]},
      {id:"F1",name:"冷凍倉",temp:"冷凍",enabled:true,open:"06:00",close:"10:00",splitPerHour:1,unloadMin:40,
       docks:[{id:"F1-D1",name:"1 號碼頭",type:"dock",enabled:true},{id:"F1-D2",name:"2 號碼頭",type:"dock",enabled:false},
              {id:"F1-P1",name:"廣場 1 號位",type:"plaza",enabled:true}]}
    ]
  };
}

/* ── 種子資料 ───────────────────────────── */
const VENDORS=[
  ["V0231","甲上食品股份有限公司"],["V0518","乙誠物流股份有限公司"],["V0742","丙原文化行銷"],
  ["V0863","丁豐農產運銷"],["V1024","戊記食品工業"],["V1187","己盛冷凍食品"],
  ["V1290","庚美生鮮"],["V1345","辛田乳品"],["V1402","壬京紙業"],["V1590","癸欣飲料"]
];
function seed(){
  const today="2026-09-02";
  const pos=[],bk=[];
  let pn=1;
  const mkPO=(vi,wh,date,pallets)=>{
    const v=VENDORS[vi];
    const po="PO-"+date.slice(2).replace(/-/g,"")+"-"+String(pn++).padStart(4,"0");
    pos.push({po,vendorCode:v[0],vendorName:v[1],whId:wh,date,pallets,items:Math.max(3,Math.round(pallets*2.4))});
    return po;
  };
  // 今日採購單（部分已預約，部分尚未預約 → 供現場 demo 操作）
  const todaySpec=[
    [0,"N1",6,"small",0,"KFB-2071","done",  {ci:"05:52",cl:"06:02",en:"06:05",lv:"06:33",dock:"N1-D1"}],
    [1,"N1",14,"large",2,"AXG-3318","done", {ci:"06:44",cl:"06:48",en:"06:52",lv:"07:04",dock:"N1-D2"}],
    [2,"N1",8,"small",2,"TPL-9042","inyard",{ci:"06:55",cl:"07:00",en:"07:03",dock:"N1-D1"}],
    [3,"C1",10,"large",2,"KKB-1188","inyard",{ci:"06:40",cl:"06:58",en:"07:01",dock:"C1-D1"}],
    [4,"N1",5,"small",2,"RFD-5520","called",{ci:"06:58",cl:"07:01",dock:"N1-D3"}],
    [5,"N1",9,"small",3,"MJC-7788","checkedin",{ci:"07:05"}],
    [9,"N1",6,"wing",3,"WNG-0088","checkedin",{ci:"07:06"}],
    [6,"N2",7,"small",1,"BQD-3391","checkedin",{ci:"07:08"}],
    [7,"C1",12,"large",4,"HHT-2264","checkedin",{ci:"07:10"}],
    [8,"N1",6,"small",6,"LNW-4417","booked",{}],
    [9,"N1",11,"large",8,"SDG-6603","booked",{}],
    [0,"N2",4,"small",4,"KFB-2071","booked",{}],
    [3,"F1",16,"large",1,"GTR-1102","booked",{}],
    [5,"C1",5,"small",1,"MJC-7788","noshow",{}]
  ];
  let seq={};
  todaySpec.forEach(([vi,wh,pl,vtid,slotIdx,plate,status,ev])=>{
    const po=mkPO(vi,wh,today,pl);
    const p=pos[pos.length-1];
    bk.push(mkBooking(p,vtid,slotIdx,plate,status,ev,today,seq));
  });
  // 未來兩日採購單（供「新增預約」demo）
  [1,2].forEach(off=>{
    const d=addDays(today,off);
    [[1,"N1",9],[4,"N1",13],[7,"C1",6],[2,"N2",5],[9,"F1",11],[6,"N1",7],[8,"N2",4]].forEach(([vi,wh,pl])=>mkPO(vi,wh,d,pl));
  });
  // 明日已預約一筆（示範可修改）
  {
    const d=addDays(today,1);
    const po=mkPO(0,"N1",d,8);
    bk.push(mkBooking(pos[pos.length-1],"small",3,"KFB-2071","booked",{},d,seq));
  }
  // 歷史紀錄（供報表）
  const hist=[
    [0,"N1","small",0,"ontime"],[0,"N1","small",2,"ontime"],[0,"C1","large",1,"ontime"],[0,"N1","small",3,"late"],
    [1,"N1","large",1,"ontime"],[1,"N1","large",4,"noshow"],[1,"N2","small",2,"passed"],[1,"N1","large",0,"ontime"],
    [2,"N2","small",1,"ontime"],[2,"N1","small",5,"ontime"],[2,"N1","wing",2,"early"],[2,"C1","small",0,"ontime"],
    [3,"C1","large",3,"late"],[3,"C1","large",2,"ontime"],[3,"F1","large",1,"noshow"],
    [4,"N1","wing",4,"ontime"],[4,"N1","wing",1,"early"],[4,"N1","small",0,"ontime"],[4,"N1","small",2,"ontime"],
    [5,"N1","small",5,"noshow"],[5,"C1","small",1,"noshow"],[5,"N1","small",3,"late"],[5,"N2","small",0,"ontime"],
    [6,"N2","small",2,"ontime"],[6,"N2","small",4,"ontime"],[7,"C1","large",3,"ontime"],[7,"C1","large",1,"late"],
    [8,"N1","small",1,"ontime"],[8,"N2","small",3,"ontime"],[9,"F1","large",0,"ontime"],[9,"F1","large",1,"passed"]
  ];
  hist.forEach(([vi,wh,vtid,slotIdx,kind],i)=>{
    const d=addDays(today,-(1+(i%6)));
    const po=mkPO(vi,wh,d,6+(i%9));
    const p=pos[pos.length-1];
    const st=slotsOfCfg(defaultConfig().warehouses.find(w=>w.id===wh))[slotIdx];
    const base=st?st.start:400;
    let status="done",ev={};
    if(kind==="noshow"){status="noshow";}
    else if(kind==="passed"){status="passed";ev={ci:hhmm(base-6),cl:hhmm(base+4)};}
    else{
      const off=kind==="late"?52:(kind==="early"?-18:-7);
      ev={ci:hhmm(base+off),cl:hhmm(base+off+5),en:hhmm(base+off+8),lv:hhmm(base+off+36),dock:wh+"-D1"};
    }
    const b=mkBooking(p,vtid,slotIdx,"XXX-0000",status,ev,d,seq);
    b.earlyFill=(kind==="early");
    bk.push(b);
  });
  return{pos,bookings:bk};
}
function mkBooking(p,vtid,slotIdx,plate,status,ev,date,seq){
  const k=p.whId+"|"+date+"|"+slotIdx;
  seq[k]=(seq[k]||0)+1;
  const letter=String.fromCharCode(65+slotIdx);
  p.bookedBy=p.po;
  return{
    id:"B"+Math.random().toString(36).slice(2,9),
    po:p.po,vendorCode:p.vendorCode,vendorName:p.vendorName,whId:p.whId,date,
    vehicleId:vtid,span:vt(vtid).span,slotIdx,plate,
    code:letter+"-"+pad(seq[k]),
    status,
    checkinAt:ev.ci?toMin(ev.ci):null, calledAt:ev.cl?toMin(ev.cl):null,
    enterAt:ev.en?toMin(ev.en):null, leaveAt:ev.lv?toMin(ev.lv):null,
    dockId:ev.dock||null, earlyFill:false, createdAt:Date.now()-Math.random()*1e7

}

/* ── 狀態 ───────────────────────────── */
let S=null;
function slotsOfCfg(wh){
  const st=toMin(wh.open),en=toMin(wh.close),step=60/wh.splitPerHour,out=[];
  for(let t=st;t+step<=en;t+=step)out.push({idx:out.length,start:t,end:t+step});
  return out;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);return}}catch(e){}
  fresh();
}
function fresh(){
  const s=seed();
  S={cfg:defaultConfig(),pos:s.pos,bookings:s.bookings,simDate:"2026-09-02",simMin:7*60+12,view:"book",ui:{}};
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const wh=id=>S.cfg.warehouses.find(w=>w.id===id);
const slotsOf=id=>slotsOfCfg(wh(id));
const cap=(w,stand)=>w.docks.filter(d=>d.enabled&&d.type===stand).length;
const LIVE=new Set(["booked","checkedin","called","inyard","done","passed","noshow"]);

function usage(whId,date,stand,excludeId){
  const w=wh(whId),n=slotsOfCfg(w).length,used=new Array(n).fill(0);
  S.bookings.forEach(b=>{
    if(b.whId!==whId||b.date!==date||!LIVE.has(b.status)||b.id===excludeId)return;
    if(vt(b.vehicleId).stand!==stand)return;
    for(let i=0;i<b.span;i++)if(b.slotIdx+i<n)used[b.slotIdx+i]++;
  });
  return used;
}
function canBook(whId,date,idx,v,used,capN){
  const slots=slotsOf(whId);
  if(capN===0||idx+v.span>slots.length)return false;
  if(date<S.simDate)return false;
  if(date===S.simDate&&slots[idx].start<=S.simMin)return false;
  for(let i=0;i<v.span;i++)if(used[idx+i]>=capN)return false;
  return true;
}
function nextCode(whId,date,idx){
  const n=S.bookings.filter(b=>b.whId===whId&&b.date===date&&b.slotIdx===idx&&LIVE.has(b.status)).length+1;
  return String.fromCharCode(65+idx)+"-"+pad(n);
}
const poOf=po=>S.pos.find(p=>p.po===po);
const bookingOfPO=po=>S.bookings.find(b=>b.po===po&&LIVE.has(b.status));

/* ── 現場推算 ───────────────────────────── */
function dockState(whId){
  const w=wh(whId),out={};
  w.docks.forEach(d=>out[d.id]={dock:d,b:null});
  S.bookings.forEach(b=>{
    if(b.whId!==whId||b.date!==S.simDate)return;
    if((b.status==="called"||b.status==="inyard")&&b.dockId&&out[b.dockId])out[b.dockId].b=b;
  });
  return out;
}
function estLeave(b){
  const w=wh(b.whId);
  return (b.enterAt||S.simMin)+w.unloadMin*b.span;
}
function queueOf(whId){
  return S.bookings.filter(b=>b.whId===whId&&b.date===S.simDate&&b.status==="checkedin")
    .sort((a,b)=>a.slotIdx-b.slotIdx||a.checkinAt-b.checkinAt||a.code.localeCompare(b.code));
}
/* 依碼頭釋出時間推估佇列每台的預估進場，等待時間 = 預估進場 − 現在 + 緩衝 */
function projectQueue(whId){
  const w=wh(whId),ds=dockState(whId),q=queueOf(whId),res=[];
  const free={dock:[],plaza:[]};
  w.docks.forEach(d=>{
    if(!d.enabled)return;
    const cur=ds[d.id].b;
    let t=S.simMin;
    if(cur)t=Math.max(S.simMin,cur.status==="inyard"?estLeave(cur):(cur.calledAt+S.cfg.callGraceMin));
    free[d.type].push(t);
  });
  q.forEach(b=>{
    const v=vt(b.vehicleId),pool=free[v.stand];
    if(!pool.length){res.push({b,eta:null});return}
    pool.sort((a,c)=>a-c);
    const eta=pool[0];
    pool[0]=eta+w.unloadMin*b.span;
    res.push({b,eta,wait:Math.max(0,eta-S.simMin)+S.cfg.waitBufferMin});
  });
  return res;
}
function autoNoShow(){
  let ch=false;
  S.bookings.forEach(b=>{
    if(b.status!=="booked")return;
    if(b.date<S.simDate){b.status="noshow";ch=true;return}
    if(b.date===S.simDate){
      const s=slotsOf(b.whId)[b.slotIdx];
      if(s&&S.simMin>s.end+30){b.status="noshow";ch=true}
    }
  });
  if(ch)save();
}
function punctual(b){
  if(b.status==="noshow")return"noshow";
  if(b.status==="passed")return"passed";
  if(b.checkinAt==null)return null;
  const s=slotsOfCfg(wh(b.whId))[b.slotIdx];
  if(!s)return null;
  if(b.earlyFill)return"early";
  return b.checkinAt<=s.end?"ontime":"late";
}
const PLABEL={ontime:"準時",late:"遲到",passed:"過號",noshow:"未到",early:"提早遞補"};

/* ── 畫面 ───────────────────────────── */
const V={};
function render(){
  autoNoShow();
  $("#simTime").textContent=hhmm(S.simMin);
  $("#simDate").textContent=dshow(S.simDate);
  $("#dcTag").textContent=DC.name;
  $$(".navbtn").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===S.view)));
  $("#view").innerHTML=V[S.view]();
  bind();
}
function toast(msg){
  $$(".toast").forEach(x=>x.remove());
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}
function go(v){S.view=v;save();render();window.scrollTo(0,0)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tempTag=w=>`<span class="temp"><i class="t-${w.temp}"></i>${w.temp}・${esc(w.name)}</span>`;

function slotGridRows(whId,date,v,selIdx,excludeId,curIdx){
  const w=wh(whId),slots=slotsOf(whId),capN=cap(w,v.stand),used=usage(whId,date,v.stand,excludeId),rows=[];
  for(let h=toMin(w.open);h<toMin(w.close);h+=60){
    const inHour=slots.filter(s=>s.start>=h&&s.start<h+60);
    if(!inHour.length)continue;
    rows.push(`<div class="slotrow"><div class="hourlab">${hhmm(h)}</div>
      <div class="slots" style="grid-template-columns:repeat(${w.splitPerHour},1fr)">
      ${inHour.map(s=>{
        const ok=canBook(whId,date,s.idx,v,used,capN);
        let left=capN-used[s.idx];
        for(let k=1;k<v.span;k++)left=Math.min(left,(s.idx+k<slots.length)?capN-used[s.idx+k]:-1);
        left=Math.max(0,left);
        const past=(date===S.simDate&&s.start<=S.simMin);
        const short=(s.idx+v.span>slots.length);
        const sel=selIdx===s.idx, isCur=curIdx===s.idx;
        return `<button class="slot${isCur?" cur":""}" data-slot="${s.idx}" ${ok?"":"disabled"} aria-pressed="${sel}" title="${hhmm(s.start)}\u2013${hhmm(slots[Math.min(s.idx+v.span-1,slots.length-1)].end)}">
          <span class="st">${hhmm(s.start)}</span>
          <span class="sc">${isCur?"\u76ee\u524d\u9810\u7d04":(ok?"\u9918 "+left+" \u4f4d":(past?"\u5df2\u904e\u6642":(short?"\u4e0d\u8db3 "+v.span+" \u683c":"\u5df2\u984d\u6eff")))}</span></button>`;
      }).join("")}</div></div>`);
  }
  return{rows,open:slots.filter(s=>canBook(whId,date,s.idx,v,used,capN)).length,capN};
}

        <div class="eyebrow">採購單號</div>

        <p style="color:var(--ink-2);margin:4px 0 0">輸入採購單號即可查詢預約狀態與進度。單號就是身分憑證，沒有單號查不到任何資料。</p>
      </div>
      <div class="row">
        <input class="mono" id="qInput" placeholder="PO-260902-0117" value="${esc(u.qPo||"")}" style="flex:1;min-width:220px;letter-spacing:.04em">
        <button class="btn pri" id="qGo">查詢</button>
      </div>
      ${u.qErr?`<div class="note warn">${esc(u.qErr)}</div>`:""}
    </div>`;
  if(!p)return H+form;

  const w=wh(p.whId), b=bookingOfPO(p.po);
  const poCard=`<div class="card"><div class="card-head"><h3>採購單 ${esc(p.po)}</h3>
      <span class="pill ${b?"p":"n"}">${b?"已預約":"尚未預約"}</span><div class="spacer"></div>
      <button class="btn sm" id="qClear">查別張單</button></div>
    <div class="card-pad"><dl class="kv">
      <dt>廠商</dt><dd>${esc(p.vendorName)} <span class="mono" style="color:var(--ink-3)">${esc(p.vendorCode)}</span></dd>
      <dt>收貨</dt><dd>${DC.name}　${tempTag(w)}</dd>
      <dt>指定進貨日</dt><dd class="mono">${dshow(p.date)}</dd>
      <dt>單量</dt><dd class="mono">${p.items} 品項 / 約 ${p.pallets} 板</dd>
    </dl></div></div>`;

  if(!b){
    const gone=p.date<S.simDate;
    return H+form+`<div class="grid" style="margin-top:16px;max-width:620px">${poCard}
      <div class="card card-pad grid" style="gap:12px">
        <div class="note ${gone?"warn":""}">${gone
          ?"此採購單指定進貨日已過期，無法再預約，請洽採購重新開單。"
          :"這張採購單<b>尚未預約</b>。請於進貨日前完成預約，未預約車輛到場需現場排隊等候空檔。"}</div>
        ${gone?"":`<div><button class="btn pri" id="qBook">前往預約這張單</button></div>`}
      </div></div>`;
  }

  const slots=slotsOf(b.whId), st=slots[b.slotIdx], en=slots[b.slotIdx+b.span-1];
  const editable=b.date>S.simDate&&b.status==="booked";
  let progress="";
  if(b.date===S.simDate){
    if(b.status==="booked"){
      progress=`<div class="note">尚未報到。請司機於 <b class="mono">${hhmm(st.start)}</b> 前抵達警衛室過刷報到。</div>`;
    }else if(b.status==="checkedin"){
      const proj=projectQueue(b.whId), i=proj.findIndex(r=>r.b.id===b.id), me=proj[i];
      progress=`<div class="stats"><div class="stat"><div class="v">${i>=0?i:"—"}</div><div class="l">前方等候車輛</div></div>
        <div class="stat mid"><div class="v">${me&&me.wait!=null?me.wait:"—"}<small style="font-size:14px"> 分</small></div><div class="l">預估等待（含 ${S.cfg.waitBufferMin} 分緩衝）</div></div>
        <div class="stat"><div class="v">${me&&me.eta!=null?hhmm(me.eta):"—"}</div><div class="l">預估叫號進場</div></div></div>
        <div class="note">已報到，請注意叫號順序。叫號後 ${S.cfg.callGraceMin} 分未進場視為過號，須重新報到。</div>`;
    }else if(b.status==="called"){
      const left=S.cfg.callGraceMin-(S.simMin-b.calledAt);
      progress=`<div class="note warn"><b>已叫號，請至 ${dockName(b)} 停靠下貨。</b>${left>0?` 剩餘 ${left} 分內進場，逾時視為過號。`:" 已逾時，請立即至警衛室重新報到。"}</div>`;
    }else if(b.status==="inyard"){
      progress=`<div class="note">下貨中（${dockName(b)}），預估離場 <b class="mono">${hhmm(estLeave(b))}</b>。完成後請做離場過刷。</div>`;
    }else if(b.status==="done"){
      progress=`<div class="note">已於 <b class="mono">${hhmm(b.leaveAt)}</b> 完成離場。</div>`;
    }else if(b.status==="passed"){
      progress=`<div class="note warn">已過號，請至警衛室重新過刷報到，系統會重新排入等候。</div>`;
    }else if(b.status==="noshow"){
      progress=`<div class="note warn">預約時段已過且未報到，本次列為未到並計入到場統計。如仍需進貨請洽現場排隊。</div>`;
    }
  }
  return H+form+`<div class="grid" style="margin-top:16px;grid-template-columns:minmax(0,1fr) minmax(0,340px);align-items:start">
    <div class="grid">${poCard}
      <div class="card"><div class="card-head"><h3>預約進度</h3><div class="spacer"></div>${statusPill(b)}</div>
        <div class="card-pad grid" style="gap:12px">${progress||`<div class="note">預約已成立，進貨日當天於警衛室過刷報到後即可查看排隊進度。</div>`}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>預約內容</h3></div>
      <div class="card-pad grid" style="gap:14px">
        <div><div class="eyebrow">預約號碼</div><div class="mono" style="font-size:34px;font-weight:600;line-height:1.1">${b.code}</div></div>
        <dl class="kv">
          <dt>預約時段</dt><dd class="mono" style="font-weight:600">${hhmm(st.start)}–${hhmm(en.end)}</dd>
          <dt>車型</dt><dd>${vt(b.vehicleId).name}（${STAND[vt(b.vehicleId).stand]}停靠）</dd>
          <dt>車牌</dt><dd class="mono">${esc(b.plate)}</dd>
        </dl>
        <div class="row" style="gap:8px">
          <button class="btn pri" data-ticket="${b.id}">預約單 / QRcode</button>
          ${editable?`<button class="btn" data-edit="${b.id}">改約</button>
                      <button class="btn danger" data-cancel="${b.id}">取消預約</button>`:""}
        </div>
        ${editable?`<div class="note" style="font-size:11.5px">改約時依當下剩餘時段重新挑選，先搶先贏；原時段會立即釋出給其他廠商。</div>`
                  :`<div class="note" style="font-size:11.5px">進貨日當天起不可自行改約或取消，如需異動請聯繫採購或現場。</div>`}
      </div>
    </div>
  </div>`;
};
function statusPill(b){
  const m={booked:["n","已預約"],checkedin:["p","已報到"],called:["a","叫號中"],inyard:["p","下貨中"],
           done:["o","已離場"],passed:["c","過號"],noshow:["c","未到"],cancelled:["n","已取消"]};
  const[k,t]=m[b.status]||["n",b.status];
  return `<span class="pill ${k}">${t}</span>${b.earlyFill?' <span class="pill o">遞補</span>':""}`;
}

/* ---- 3. 警衛室 ---- */
V.guard=()=>{
  const whId=S.ui.gWh||S.cfg.warehouses[0].id;
  const today=S.bookings.filter(b=>b.date===S.simDate&&b.whId===whId);
  const waiting=today.filter(b=>b.status==="booked").sort((a,b)=>a.slotIdx-b.slotIdx);
  const arrived=today.filter(b=>["checkedin","called","inyard","done"].includes(b.status))
    .sort((a,b)=>(b.checkinAt||0)-(a.checkinAt||0));
  const called=today.filter(b=>b.status==="called");
  return head("警衛室過刷","司機到場過刷報到，叫號後進場、下貨完離場。前一位過號時可讓下一位提早進廠。")+
  `<div class="row" style="margin-bottom:16px">
     <label class="fld">倉別<select id="gWh">${S.cfg.warehouses.map(w=>`<option value="${w.id}" ${w.id===whId?"selected":""}>${w.temp}・${w.name}</option>`).join("")}</select></label>
   </div>
   <div class="grid" style="grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start">
     <div class="grid">
       <div class="card">
         <div class="card-head"><h3>過刷報到</h3></div>
         <div class="card-pad grid" style="gap:10px">
           <label class="fld">請過刷 QRcode（或輸入預約號碼 / 採購單號）
             <input class="mono" id="scan" placeholder="A-01" style="text-transform:uppercase;font-size:16px"></label>
           <button class="btn pri" id="scanGo">報到</button>
           ${S.ui.scanMsg?`<div class="note ${S.ui.scanOk?"":"warn"}">${esc(S.ui.scanMsg)}</div>`:""}
         </div>
       </div>
       ${called.length?`<div class="card"><div class="card-head"><h3>已叫號待進場</h3></div>
         <div class="card-pad grid" style="gap:10px">${called.map(b=>{
           const over=S.simMin-b.calledAt, late=over>S.cfg.callGraceMin;
           return `<div class="row" style="justify-content:space-between;border:1px solid ${late?"var(--crit)":"var(--line)"};border-radius:var(--r);padding:10px 12px">
             <div><div class="qnum">${b.code}</div><div style="font-size:12px;color:var(--ink-2)">${esc(b.vendorName)}<br><span class="num">${esc(b.plate)}</span>・${b.dockId?dockName(b):"未指派"}</div></div>
             <div style="text-align:right">
               <div class="num" style="color:${late?"var(--crit)":"var(--ink-2)"};font-size:12px">叫號 ${hhmm(b.calledAt)}（${over} 分）</div>
               <div class="row" style="justify-content:flex-end;margin-top:6px">
                 <button class="btn sm pri" data-enter="${b.id}">進場過刷</button>
                 ${late?`<button class="btn sm danger" data-pass="${b.id}">判定過號</button>`:""}
               </div></div></div>`;
         }).join("")}</div></div>`:""}
     </div>
     <div class="grid">
       <div class="card">
         <div class="card-head"><h3>今日應到未到</h3><div class="spacer"></div><span class="pill n">${waiting.length}</span></div>
         <div class="tbl-wrap"><table><thead><tr><th>號碼</th><th>時段</th><th>廠商</th><th>車型 / 車牌</th><th></th></tr></thead>
         <tbody>${waiting.map(b=>{const s=slotsOf(b.whId)[b.slotIdx];return `<tr>
           <td class="qnum">${b.code}</td><td class="num">${hhmm(s.start)}</td><td>${esc(b.vendorName)}</td>
           <td>${vt(b.vehicleId).name}<br><span class="num" style="font-size:12px;color:var(--ink-2)">${esc(b.plate)}</span></td>
           <td><button class="btn sm" data-checkin="${b.id}">代為報到</button></td></tr>`}).join("")
           ||`<tr><td colspan="5" class="empty">全數報到完畢。</td></tr>`}</tbody></table></div>
       </div>
       <div class="card">
         <div class="card-head"><h3>今日已報到</h3><div class="spacer"></div><span class="pill n">${arrived.length}</span></div>
         <div class="tbl-wrap"><table><thead><tr><th>號碼</th><th>報到</th><th>廠商</th><th>狀態</th><th>碼頭</th><th></th></tr></thead>
         <tbody>${arrived.map(b=>`<tr>
           <td class="qnum">${b.code}</td><td class="num">${b.checkinAt!=null?hhmm(b.checkinAt):"—"}</td>
           <td>${esc(b.vendorName)}</td><td>${statusPill(b)}</td><td>${b.dockId?dockName(b):"—"}</td>
           <td>${b.status==="inyard"?`<button class="btn sm" data-leave="${b.id}">離場過刷</button>`:""}</td></tr>`).join("")
           ||`<tr><td colspan="6" class="empty">尚無報到紀錄。</td></tr>`}</tbody></table></div>
       </div>
     </div>
   </div>`;
};
function dockName(b){const w=wh(b.whId),d=w.docks.find(x=>x.id===b.dockId);return d?esc(d.name):"—"}

/* ---- 4. 碼頭看板 ---- */
V.board=()=>{
  const whId=S.ui.bWh||S.cfg.warehouses[0].id, w=wh(whId), ds=dockState(whId), proj=projectQueue(whId);
  const cards=w.docks.map(d=>{
    if(!d.enabled)return `<div class="dock off"><div class="bar"></div><div class="body">
      <div class="dn"><b>${esc(d.name)}</b><span class="pill n">未啟用</span></div>
      <div style="color:var(--ink-3);font-size:12px">此${STAND[d.type]}位目前關閉，不計入可預約容量。</div></div></div>`;
    const b=ds[d.id].b;
    if(!b)return `<div class="dock"><div class="bar"></div><div class="body">
      <div class="dn"><b>${esc(d.name)}</b><span class="pill o">可用</span></div>
      <div class="code" style="color:var(--ink-3)">—</div>
      <div class="meta">等待叫號車輛進場</div></div></div>`;
    if(b.status==="called"){
      const over=S.simMin-b.calledAt, late=over>S.cfg.callGraceMin;
      return `<div class="dock ${late?"late":"called"}"><div class="bar"></div><div class="body">
        <div class="dn"><b>${esc(d.name)}</b><span class="pill ${late?"c":"a"}">${late?"已過號":"已叫號未進場"}</span></div>
        <div class="code">${b.code}</div>
        <div class="meta">叫號 ${hhmm(b.calledAt)}<br>${late?"逾 "+(over-S.cfg.callGraceMin)+" 分，可放行下一位":(S.cfg.callGraceMin-over)+" 分後視為過號"}</div></div></div>`;
    }
    const out=estLeave(b), delay=S.simMin-out;
    return `<div class="dock busy"><div class="bar"></div><div class="body">
      <div class="dn"><b>${esc(d.name)}</b><span class="pill p">下貨中</span></div>
      <div class="code">${b.code}</div>
      <div class="meta">進倉 ${hhmm(b.enterAt)}　預估離場 ${hhmm(out)}<br>${delay>0?`<span style="color:var(--crit)">已延遲 ${delay} 分</span>`:esc(b.vendorName)}</div></div></div>`;
  }).join("");
  const nowCalling=S.bookings.filter(x=>x.whId===whId&&x.date===S.simDate&&(x.status==="called"||x.status==="inyard")).map(x=>x.code).join("、")||"—";
  return head("碼頭看板","現場即時碼頭佔用與排隊順序。等待時間＝前車預估離場加 "+S.cfg.waitBufferMin+" 分緩衝。")+
  `<div class="row" style="margin-bottom:16px">
     <label class="fld">倉別<select id="bWh">${S.cfg.warehouses.map(x=>`<option value="${x.id}" ${x.id===whId?"selected":""}>${x.temp}・${x.name}</option>`).join("")}</select></label>
     <div class="spacer"></div>
     <div style="text-align:right"><div class="eyebrow">目前驗收編號</div><div class="mono" style="font-size:18px;font-weight:600">${nowCalling}</div></div>
   </div>
   <div class="docks" style="margin-bottom:20px">${cards}</div>
   <div class="card">
     <div class="card-head"><h3>進場排隊順序</h3><div class="spacer"></div><span class="pill n">${proj.length} 台等候</span></div>
     <div class="tbl-wrap"><table><thead><tr>
       <th>順位</th><th>號碼</th><th>預約時段</th><th>報到</th><th>廠商 / 車牌</th><th>車型</th><th>預估進場</th><th>預估等待</th><th></th>
     </tr></thead><tbody>${proj.map((r,i)=>{
       const s=slotsOf(whId)[r.b.slotIdx];
       const wcls=r.wait==null?"":(r.wait<=25?"soon":(r.wait>60?"long":""));
       return `<tr>
         <td class="num" style="color:var(--ink-3)">${i+1}</td>
         <td class="qnum">${r.b.code}</td>
         <td class="num">${hhmm(s.start)}</td>
         <td class="num">${hhmm(r.b.checkinAt)}</td>
         <td>${esc(r.b.vendorName)}<br><span class="num" style="font-size:12px;color:var(--ink-2)">${esc(r.b.plate)}</span></td>
         <td>${vt(r.b.vehicleId).name}</td>
         <td class="num">${r.eta!=null?hhmm(r.eta):"—"}</td>
         <td class="wait ${wcls}">${r.wait!=null?r.wait+" 分":"—"}</td>
         <td><button class="btn sm pri" data-call="${r.b.id}">叫號指派</button></td></tr>`;
     }).join("")||`<tr><td colspan="9" class="empty">目前沒有等候中的車輛。</td></tr>`}</tbody></table></div>
   </div>`;
};

/* ---- 5. 報表 ---- */
V.report=()=>{
  const from=S.ui.rFrom||addDays(S.simDate,-14), to=S.ui.rTo||S.simDate;
  const rows=S.bookings.filter(b=>b.date>=from&&b.date<=to&&LIVE.has(b.status));
  const agg={};
  rows.forEach(b=>{
    const k=b.vendorCode;
    agg[k]=agg[k]||{code:k,name:b.vendorName,ontime:0,late:0,passed:0,noshow:0,early:0,total:0};
    const p=punctual(b);
    if(!p)return;
    agg[k][p]++;agg[k].total++;
  });
  const list=Object.values(agg).sort((a,b)=>(a.ontime+a.early)/(a.total||1)-(b.ontime+b.early)/(b.total||1));
  const sum=list.reduce((a,x)=>({ontime:a.ontime+x.ontime,late:a.late+x.late,passed:a.passed+x.passed,noshow:a.noshow+x.noshow,early:a.early+x.early,total:a.total+x.total}),
    {ontime:0,late:0,passed:0,noshow:0,early:0,total:0});
  const rate=t=>sum.total?Math.round((sum.ontime+sum.early)/sum.total*100):0;
  return head("到場準點報表","僅供採購與廠商檢討使用，不影響預約權限。統計區間可自訂並匯出。")+
  `<div class="row" style="margin-bottom:16px">
     <label class="fld">起<input type="date" id="rFrom" value="${from}"></label>
     <label class="fld">迄<input type="date" id="rTo" value="${to}"></label>
     <div class="spacer"></div><button class="btn" id="exportCsv">匯出 CSV</button>
   </div>
   <div class="stats" style="margin-bottom:20px">
     <div class="stat good"><div class="v">${rate()}%</div><div class="l">整體準點率</div></div>
     <div class="stat"><div class="v">${sum.ontime}</div><div class="l">準時到場</div></div>
     <div class="stat good"><div class="v">${sum.early}</div><div class="l">提早遞補進場</div></div>
     <div class="stat mid"><div class="v">${sum.late}</div><div class="l">遲到報到</div></div>
     <div class="stat mid"><div class="v">${sum.passed}</div><div class="l">叫號過號</div></div>
     <div class="stat bad"><div class="v">${sum.noshow}</div><div class="l">預約未到</div></div>
   </div>
   <div class="card">
     <div class="card-head"><h3>廠商別統計</h3><div class="spacer"></div><span class="pill n">${list.length} 家・${sum.total} 車次</span></div>
     <div class="tbl-wrap"><table><thead><tr>
       <th>廠商代號</th><th>廠商名稱</th><th>車次</th><th>準時</th><th>提早遞補</th><th>遲到</th><th>過號</th><th>未到</th><th style="min-width:130px">準點率</th>
     </tr></thead><tbody>${list.map(x=>{
       const r=x.total?Math.round((x.ontime+x.early)/x.total*100):0;
       const cls=r>=85?"":(r>=65?"mid":"bad");
       return `<tr>
         <td class="num">${x.code}</td><td>${esc(x.name)}</td>
         <td class="num">${x.total}</td><td class="num">${x.ontime}</td><td class="num">${x.early}</td>
         <td class="num" style="${x.late?"color:var(--accent)":""}">${x.late}</td>
         <td class="num" style="${x.passed?"color:var(--accent)":""}">${x.passed}</td>
         <td class="num" style="${x.noshow?"color:var(--crit);font-weight:600":""}">${x.noshow}</td>
         <td><div class="row" style="gap:8px;flex-wrap:nowrap"><span class="num" style="width:38px">${r}%</span>
           <div class="bar-mini" style="flex:1"><i class="${cls}" style="width:${r}%"></i></div></div></td></tr>`;
     }).join("")||`<tr><td colspan="9" class="empty">此區間沒有紀錄。</td></tr>`}</tbody></table></div>
   </div>
   <div class="note" style="margin-top:14px">判定方式：報到時間早於或等於預約時段結束＝準時；晚於＝遲到；叫號後 ${S.cfg.callGraceMin} 分未進場＝過號；時段結束 30 分後仍未報到＝未到。因前車過號而被提前放行者另計為「提早遞補」，不影響該廠商準點率。</div>`;
};

/* ---- 6. 參數設定 ---- */
V.param=()=>{
  return head("參數設定","碼頭啟用與時段切分會直接改變廠商端看到的可預約格數，可現場調整後回到預約頁對照。")+
  `<div class="grid" style="gap:16px">
    <div class="card"><div class="card-head"><h3>全廠參數</h3></div><div class="card-pad row" style="gap:20px">

    b.onmouseleave=()=>$$(".slot.hl",v).forEach(e=>e.classList.remove("hl"));

  });
  const pl=$("#plate",v); if(pl)pl.oninput=e=>{S.ui.plate=e.target.value.toUpperCase();save();
    const c=$("#confirm");if(c)c.disabled=!(S.ui.slot!=null&&e.target.value.trim())};
  const cf=$("#confirm",v); if(cf)cf.onclick=commit;
  const ce=$("#cancelEdit",v); if(ce)ce.onclick=()=>{
    const po=S.ui.poData; S.ui={qPo:po?po.po:"",qData:po||null}; save(); go("mine");
  };

  const qg=$("#qGo",v); if(qg)qg.onclick=lookupQuery;
  const qi=$("#qInput",v); if(qi)qi.onkeydown=e=>{if(e.key==="Enter")lookupQuery()};
  const qc=$("#qClear",v); if(qc)qc.onclick=()=>{S.ui={};save();render()};
  const qb=$("#qBook",v); if(qb)qb.onclick=()=>{

  $$("[data-ticket]",v).forEach(b=>b.onclick=()=>showTicket(b.dataset.ticket));
  $$("[data-edit]",v).forEach(b=>b.onclick=()=>{
    const bk=S.bookings.find(x=>x.id===b.dataset.edit);

  $$("[data-evt]",v).forEach(b=>b.onclick=()=>{
    const e=S.ui.edit;e.vtype=b.dataset.evt;e.err="";
    const bk=S.bookings.find(x=>x.id===e.bid);

    save();render();

  const ep=$("#ePlate",v); if(ep)ep.oninput=e2=>{S.ui.edit.plate=e2.target.value.toUpperCase();save();render()};
  const ec=$("#eConfirm",v); if(ec)ec.onclick=commitEdit;

  const gw=$("#gWh",v); if(gw)gw.onchange=e=>{S.ui.gWh=e.target.value;S.ui.scanMsg="";save();render()};

  const ex=$("#exportCsv",v); if(ex)ex.onclick=exportCsv;

function lookupPO(){
  const val=($("#poInput").value||"").trim().toUpperCase();
  S.ui.po=val;S.ui.poErr="";
  const p=S.pos.find(x=>x.po.toUpperCase()===val);
  if(!p){S.ui.poErr="查無此採購單號。請確認採購提供的單號，或聯繫採購確認該單是否已核可。";S.ui.poData=null}
  else if(bookingOfPO(p.po)){S.ui.poErr="採購單 "+p.po+" 已完成預約（"+bookingOfPO(p.po).code+"）。如需調整請至「預約查詢」。";S.ui.poData=null}
  else if(p.date<S.simDate){S.ui.poErr="採購單指定進貨日 "+p.date+" 已過期，請洽採購重新開單。";S.ui.poData=null}
  else{S.ui.poData=p;S.ui.vtype=S.ui.vtype||"small";S.ui.slot=null;S.ui.poErr=""}
  save();render();
}
function lookupQuery(){
  const val=($("#qInput").value||"").trim().toUpperCase();
  S.ui.qPo=val;S.ui.qErr="";S.ui.qData=null;
  if(!val){S.ui.qErr="請輸入採購單號。";save();render();return}
  const p=S.pos.find(x=>x.po.toUpperCase()===val);
  if(!p){S.ui.qErr="查無此採購單號。請確認採購提供的單號是否正確。";save();render();return}
  S.ui.qData=p;save();render();
}
function commit(){
  const u=S.ui,p=u.poData,v=vt(u.vtype);
  const used=usage(p.whId,p.date,v.stand,null),capN=cap(wh(p.whId),v.stand);
  if(!canBook(p.whId,p.date,u.slot,v,used,capN)){toast("此時段剛被訂走，請改選其他時段");S.ui.slot=null;save();render();return}
  const b={id:"B"+Math.random().toString(36).slice(2,9),po:p.po,vendorCode:p.vendorCode,vendorName:p.vendorName,
       whId:p.whId,date:p.date,vehicleId:v.id,span:v.span,slotIdx:u.slot,plate:u.plate.trim().toUpperCase(),
       code:nextCode(p.whId,p.date,u.slot),status:"booked",checkinAt:null,calledAt:null,enterAt:null,
       leaveAt:null,dockId:null,earlyFill:false,createdAt:Date.now()};
  S.bookings.push(b);
  S.ui={qPo:p.po,qData:p};S.view="mine";save();render();showTicket(b.id);
}
function abortEdit(){
  const po=S.ui.qData||poOf(S.bookings.find(x=>x.id===(S.ui.edit||{}).bid)?.po);
  S.ui={qPo:po?po.po:"",qData:po||null};save();go("mine");toast("已放棄修改，原預約維持不變");
}
function commitEdit(){
  const e=S.ui.edit, b=S.bookings.find(x=>x.id===e.bid), v=vt(e.vtype);
  const plate=(e.plate||"").trim().toUpperCase();
  const used=usage(b.whId,b.date,v.stand,b.id), capN=cap(wh(b.whId),v.stand);
  if(!canBook(b.whId,b.date,e.slot,v,used,capN)){
    e.slot=null;e.err="你選的時段剛被其他廠商訂走，請重新挑選。原預約仍為 "+b.code+"，尚未變更。";
    save();render();return;
  }
  const chgSlot=e.slot!==b.slotIdx, oldCode=b.code;
  const nc=chgSlot?nextCode(b.whId,b.date,e.slot):b.code;
  b.vehicleId=v.id;b.span=v.span;b.plate=plate;
  if(chgSlot){b.slotIdx=e.slot;b.code=nc}
  const po=poOf(b.po);
  S.ui={qPo:po.po,qData:po};S.view="mine";save();render();showTicket(b.id);
  toast(chgSlot?("改約完成，預約號碼由 "+oldCode+" 換發為 "+b.code):"改約完成，預約號碼維持 "+b.code);
}
function confirmCancel(id){
  const b=S.bookings.find(x=>x.id===id), slots=slotsOf(b.whId);
  const st=slots[b.slotIdx], en=slots[b.slotIdx+b.span-1];
  $("#layer").innerHTML=`<div class="scrim" id="scrimX"><div class="modal" style="max-width:420px">
    <div class="card-head"><h3>取消預約 ${b.code}</h3></div>
    <div class="card-pad grid" style="gap:13px">
      <dl class="kv">
        <dt>採購單號</dt><dd class="mono">${b.po}</dd>
        <dt>進貨日</dt><dd class="mono">${dshow(b.date)}</dd>
        <dt>預約時段</dt><dd class="mono">${hhmm(st.start)}–${hhmm(en.end)}</dd>
      </dl>
      <div class="note warn">取消後時段立即釋出給其他廠商，<b>無法復原</b>。若之後仍要進貨，需以同一張採購單重新預約，並依當時剩餘時段挑選。</div>
      <div class="row" style="gap:8px">
        <button class="btn danger" id="doCancel" style="flex:1">確認取消預約</button>
        <button class="btn" id="keepIt" style="flex:1">保留預約</button>
      </div>
    </div></div></div>`;
  $("#doCancel").onclick=()=>{
    b.status="cancelled";$("#layer").innerHTML="";save();render();
    toast("已取消 "+b.code+"，時段已釋出");
  };
  $("#keepIt").onclick=()=>$("#layer").innerHTML="";
  $("#scrimX").onclick=ev=>{if(ev.target.id==="scrimX")$("#layer").innerHTML=""};
}
function checkin(b){
  if(!b)return;
  b.status="checkedin";b.checkinAt=S.simMin;save();render();
  const s=slotsOf(b.whId)[b.slotIdx];
  toast(b.code+" 報到成功"+(S.simMin>s.end?"（已逾預約時段，列入遲到）":""));
}
function doScan(){
  const raw=($("#scan").value||"").trim().toUpperCase();
  const whId=S.ui.gWh||S.cfg.warehouses[0].id;
  S.ui.scanOk=false;
  if(!raw){S.ui.scanMsg="請先過刷 QRcode 或輸入預約號碼。";save();render();return}
  const match=b=>(b.code===raw||b.po.toUpperCase()===raw)&&LIVE.has(b.status);
  // 預約號碼僅在「同倉別＋同時段」內唯一，跨倉別可能撞號：以目前選定倉別優先比對
  const todayHits=S.bookings.filter(b=>match(b)&&b.date===S.simDate);
  if(!todayHits.length){
    const other=S.bookings.find(match);
    S.ui.scanMsg=other?("非今日進貨預約（預約日 "+other.date+"）。"):"查無此預約：非本中心預約資料。";
    save();render();return;
  }
  const hit=todayHits.find(b=>b.whId===whId)||todayHits[0];
  let dup="";
  if(todayHits.length>1){
    dup="（今日有 "+todayHits.length+" 筆同號，分屬不同倉別，已比對 "+wh(hit.whId).name+"；建議改用採購單號過刷）";
  }
  if(hit.whId!==whId){S.ui.gWh=hit.whId}
  if(hit.status==="checkedin"){S.ui.scanMsg=hit.code+" 尚未叫號，請注意叫號訊息。"+dup;save();render();return}
  if(hit.status==="called"){S.ui.scanMsg=hit.code+" 已叫號，請至 "+dockName(hit)+" 停靠下貨。"+dup;S.ui.scanOk=true;save();render();return}
  if(hit.status==="inyard"){S.ui.scanMsg=hit.code+" 下貨中，完成後請做離場過刷。"+dup;S.ui.scanOk=true;save();render();return}
  if(hit.status==="done"){S.ui.scanMsg=hit.code+" 已完成離場。"+dup;save();render();return}
  if(hit.status==="passed"){hit.status="checkedin";hit.checkinAt=S.simMin;hit.calledAt=null;
    S.ui.scanMsg=hit.code+" 已過號，重新排入等候。"+dup;S.ui.scanOk=true;save();render();return}
  checkin(hit);
  S.ui.scanMsg=hit.code+"　"+hit.vendorName+" 報到成功，請注意叫號順序。"+dup;S.ui.scanOk=true;
  save();render();
}
function callUp(id){
  const b=S.bookings.find(x=>x.id===id),v=vt(b.vehicleId),ds=dockState(b.whId);
  const free=wh(b.whId).docks.filter(d=>d.enabled&&d.type===v.stand&&!ds[d.id].b);
  if(!free.length){toast("目前沒有空閒的"+STAND[v.stand]+"位，請待前車離場");return}
  b.status="called";b.calledAt=S.simMin;b.dockId=free[0].id;
  save();render();toast(b.code+" 叫號 → "+free[0].name);
}
/* 預約單 QRcode 內容：指回本頁的深層連結，手機掃描直接開啟該單進度。
   採購單號可還原廠商、倉別與進貨日，故只需再帶號碼、時段、車型、車牌四項。 */
function ticketUrl(b){
  const q=new URLSearchParams({po:b.po,c:b.code,s:String(b.slotIdx),v:b.vehicleId,p:b.plate});
  return location.origin+location.pathname+"?"+q.toString();
}
/* 掃碼進來時：本機若沒有這筆預約（例如換一台手機開啟），依連結參數還原後再顯示 */
function applyDeepLink(){
  let q;
  try{q=new URLSearchParams(location.search)}catch(e){return false}
  const po=(q.get("po")||"").trim().toUpperCase();
  if(!po)return false;
  const p=S.pos.find(x=>x.po.toUpperCase()===po);
  if(!p)return false;
  if(!bookingOfPO(p.po)&&q.get("c")){
    const v=vt(q.get("v"))||vt("small"), idx=parseInt(q.get("s"),10);
    if(!isNaN(idx)&&idx>=0&&idx<slotsOf(p.whId).length){
      S.bookings.push({id:"B"+Math.random().toString(36).slice(2,9),po:p.po,
        vendorCode:p.vendorCode,vendorName:p.vendorName,whId:p.whId,date:p.date,
        vehicleId:v.id,span:v.span,slotIdx:idx,plate:(q.get("p")||"").toUpperCase(),
        code:q.get("c"),status:"booked",checkinAt:null,calledAt:null,enterAt:null,
        leaveAt:null,dockId:null,earlyFill:false,createdAt:Date.now()});
    }
  }
  S.ui={qPo:p.po,qData:p};S.view="mine";save();
  try{history.replaceState(null,"",location.origin+location.pathname)}catch(e){}
  return true;
}
function showTicket(id){
  const b=S.bookings.find(x=>x.id===id),w=wh(b.whId),slots=slotsOf(b.whId);
  const s=slots[b.slotIdx],e=slots[b.slotIdx+b.span-1];
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="modal"><div class="ticket">
    <div class="th"><div class="co">範例物流股份有限公司<small>SAMPLE LOGISTICS — DEMO ONLY</small></div>
      <div style="text-align:right"><div class="eyebrow">預約號碼</div><div class="big">${b.code}</div></div></div>
    <dl class="kv">
      <dt>廠商</dt><dd>${esc(b.vendorName)}</dd>
      <dt>採購單號</dt><dd class="mono">${b.po}</dd>
      <dt>進貨指定日</dt><dd class="mono">${dshow(b.date)}</dd>
      <dt>收貨</dt><dd>${DC.name}　${w.temp}・${esc(w.name)}</dd>
      <dt>預約時段</dt><dd class="mono" style="font-weight:600">${hhmm(s.start)}–${hhmm(e.end)}</dd>
      <dt>車型 / 車牌</dt><dd>${vt(b.vehicleId).name}　<span class="mono">${esc(b.plate)}</span>（${STAND[vt(b.vehicleId).stand]}停靠）</dd>
    </dl>
    <div class="qrbox" id="qr"></div>
    <div style="text-align:center;font-size:11.5px;color:var(--ink-3);margin-bottom:2px">手機掃描即可查看本次進貨的即時進度</div>
    <div class="rules"><ol>
      <li>司機抵達物流中心後，先至警衛室過刷報到。</li>
      <li>過刷 QRcode 可查詢驗收進度，請注意叫號順序。</li>
      <li>叫號後 ${S.cfg.callGraceMin} 分未進場視為過號，須重新報到。</li>
      <li>實際進場時間依現場叫號為主。</li>
    </ol></div>
    <div class="row" style="margin-top:16px"><button class="btn pri" id="closeT" style="flex:1">關閉</button></div>
  </div></div></div>`;
  try{
    if(window.QRCode)new QRCode($("#qr"),{text:ticketUrl(b),width:156,height:156,
      colorDark:"#161B19",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    else $("#qr").innerHTML=fakeQR(b.code);
  }catch(err){$("#qr").innerHTML=fakeQR(b.code)}
  $("#closeT").onclick=()=>$("#layer").innerHTML="";
  $("#scrim").onclick=ev=>{if(ev.target.id==="scrim")$("#layer").innerHTML=""};
}
function fakeQR(seed){
  let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
  let s="";const n=21;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    h=(h*1103515245+12345)>>>0;
    if((h>>>16)%2)s+=`<rect x="${x*6}" y="${y*6}" width="6" height="6"/>`;
  }
  return `<svg width="126" height="126" viewBox="0 0 126 126" fill="#161B19">${s}</svg>`;
}
function exportCsv(){
  const from=S.ui.rFrom||addDays(S.simDate,-14),to=S.ui.rTo||S.simDate;
  const rows=S.bookings.filter(b=>b.date>=from&&b.date<=to&&LIVE.has(b.status));
  const lines=["進貨日,採購單號,廠商代號,廠商名稱,倉別,預約號碼,預約時段,車型,車牌,報到時間,判定"];
  rows.forEach(b=>{
    const w=wh(b.whId),s=slotsOf(b.whId)[b.slotIdx],p=punctual(b);
    lines.push([b.date,b.po,b.vendorCode,b.vendorName,w.temp+w.name,b.code,s?hhmm(s.start):"",
      vt(b.vehicleId).name,b.plate,b.checkinAt!=null?hhmm(b.checkinAt):"",PLABEL[p]||""].join(","));
  });
  const csv=lines.join("\n");
  $("#layer").innerHTML=`<div class="scrim" id="scrim2"><div class="modal" style="max-width:640px"><div class="card-head"><h3>匯出 CSV</h3></div>
    <div class="card-pad grid" style="gap:10px">
      <div class="note">共 ${rows.length} 筆。請複製下方內容貼入 Excel（分隔符號選逗號）。</div>
      <textarea id="csvBox" readonly>${esc(csv)}</textarea>
      <div class="row"><button class="btn pri" id="copyCsv">複製全部</button><button class="btn" id="closeC">關閉</button></div>
    </div></div></div>`;
  $("#copyCsv").onclick=()=>{const t=$("#csvBox");t.select();
    try{navigator.clipboard.writeText(csv)}catch(e){try{document.execCommand("copy")}catch(e2){}}
    toast("已複製 "+rows.length+" 筆")};
  $("#closeC").onclick=()=>$("#layer").innerHTML="";
  $("#scrim2").onclick=ev=>{if(ev.target.id==="scrim2")$("#layer").innerHTML=""};
}

/* ── 啟動 ───────────────────────────── */
$$(".navbtn").forEach(b=>b.onclick=()=>{S.ui={};go(b.dataset.view)});
$$("[data-adv]").forEach(b=>b.onclick=()=>{
  S.simMin+=+b.dataset.adv;
  if(S.simMin>=24*60){S.simMin-=24*60;S.simDate=addDays(S.simDate,1)}
  save();render();
});
$("#resetBtn").onclick=()=>{fresh();render();toast("已重設為初始 Demo 資料")};
load();applyDeepLink();render();
</script>
</body>
</html>
