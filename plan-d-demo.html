<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="進貨預約系統 D 案 Demo：採購單預約查詢合一、滿版過刷報到、即時看板、手機現場候位與報到分析。">
<meta name="robots" content="noindex">
<title>範例物流 進貨預約系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 白底高對比：內文與圖示一律深色，狀態色都挑在白底上對比 ≥ 4.5:1 的深色階，淺色只用在底色塊。 */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --soft:#F3F5F8; --soft-2:#E6EAF0;
  --line:#CDD3DC; --line-2:#8C96A5;
  --ink:#0B1220; --ink-2:#2A3342; --ink-3:#465163;
  --brand:#0A4DA2; --brand-2:#083B7D; --brand-soft:#E5EEFA; --brand-line:#9DBBE6;
  --ok:#0A6E35; --ok-bar:#12924A; --ok-soft:#E2F4E9; --ok-line:#8FCDA8;
  --late:#8A4700; --late-bar:#D97A06; --late-soft:#FFF0D6; --late-line:#F0B660;
  --bad:#A91B1B; --bad-bar:#D63B3B; --bad-soft:#FDE6E6; --bad-line:#EFA1A1;
  --walk:#5A2C9E; --walk-bar:#7A4CC2; --walk-soft:#EFE8FA; --walk-line:#BFA5E6;
  --wait:#2A3342; --wait-bar:#A7B0BD; --wait-soft:#EEF1F5;
  --amb:#8A4F00; --chill:#0A5A8A;
  --r:10px;
  --shadow:0 1px 2px rgba(11,18,32,.06),0 4px 14px rgba(11,18,32,.06);
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:700}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.ic{display:inline-block;vertical-align:-3px;flex:none}
a{color:var(--brand);font-weight:600}

/* ── 外框 ── */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--ink);
  display:flex;align-items:center;gap:18px;padding:10px 24px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.brandmark .co{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;line-height:1.2}
.brandmark .sys{font-size:21px;font-weight:900;color:var(--ink);letter-spacing:.04em;line-height:1.25}
.spacer{flex:1}
.clockbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border:1.5px solid var(--line);border-radius:8px}
.clock .lab{font-size:12px;color:var(--ink-3);font-weight:700}
.clock .t{font-size:22px;font-weight:600}
.clock .d{font-size:13px;color:var(--ink-2)}

.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100vh - 68px)}
.rail{border-right:1.5px solid var(--line);padding:16px 12px;background:#fff}
.rail-group{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;margin:16px 10px 6px}
.rail-group:first-child{margin-top:2px}
.navrow{display:flex;align-items:center;gap:2px}
.navbtn{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;
  padding:9px 10px;border-radius:8px;font-weight:600;color:var(--ink-2);cursor:pointer;min-width:0;white-space:nowrap}
.navbtn:hover{background:var(--soft);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--brand-soft);color:var(--brand-2);box-shadow:inset 3px 0 0 var(--brand)}
.navbtn .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.newtab{border:0;background:none;padding:7px;border-radius:6px;color:var(--ink-3);cursor:pointer;display:grid;place-items:center}
.newtab:hover{background:var(--soft);color:var(--brand)}
main.wrap{padding:26px 32px 60px;max-width:1320px;width:100%}

.page-head{margin-bottom:20px}
.page-head h2{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.page-head p{margin:6px 0 0;color:var(--ink-2);max-width:760px}

/* ── 元件 ── */
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.card-h h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.pad{padding:16px 18px}
.grid{display:grid;gap:16px}
.grid>*,.card,.app>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepno{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:8px;
  border:1.5px solid var(--line-2);background:#fff;color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.sm{height:32px;padding:0 11px;font-size:13.5px}
.btn.lg{height:52px;padding:0 22px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible,.slot:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.fld{display:grid;gap:5px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
input,select,textarea{height:44px;border:1.5px solid var(--line-2);border-radius:8px;background:#fff;padding:0 12px;min-width:0}
input::placeholder{color:#6B7585}
textarea{height:220px;width:100%;padding:10px;font-family:var(--f-mono);font-size:12.5px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px;border:1.5px solid;white-space:nowrap;line-height:1.6}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.pill.late{color:var(--late);background:var(--late-soft);border-color:var(--late-line)}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-line)}
.pill.walk{color:var(--walk);background:var(--walk-soft);border-color:var(--walk-line)}
.pill.wait{color:var(--wait);background:var(--wait-soft);border-color:var(--line)}
.pill.brand{color:var(--brand-2);background:var(--brand-soft);border-color:var(--brand-line)}

.note{padding:10px 14px;border-radius:8px;background:var(--soft);border-left:4px solid var(--line-2);color:var(--ink);font-size:14px}
.note.brand{background:var(--brand-soft);border-color:var(--brand)}
.note.ok{background:var(--ok-soft);border-color:var(--ok)}
.note.warn{background:var(--late-soft);border-color:var(--late-bar)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}

dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:7px 16px;margin:0}
dl.kv dt{color:var(--ink-3);font-weight:700;font-size:13.5px}
dl.kv dd{margin:0;font-weight:500}
.muted{color:var(--ink-3)}
.temp{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.temp i{width:4px;height:14px;border-radius:2px;display:inline-block}
.temp .t-常溫{background:var(--amb)} .temp .t-低溫{background:var(--chill)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--soft);color:var(--ink-2);font-size:13px;font-weight:700;text-align:left;padding:9px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--soft-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.empty{text-align:center;color:var(--ink-3);padding:26px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--brand-soft)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;border-top:5px solid var(--line-2);background:#fff}
.kpi .v{font-size:32px;font-weight:900;line-height:1.15;font-family:var(--f-mono)}
.kpi .l{font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .s{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi.ok{border-top-color:var(--ok-bar)} .kpi.ok .v{color:var(--ok)}
.kpi.late{border-top-color:var(--late-bar)} .kpi.late .v{color:var(--late)}
.kpi.bad{border-top-color:var(--bad-bar)} .kpi.bad .v{color:var(--bad)}
.kpi.walk{border-top-color:var(--walk-bar)} .kpi.walk .v{color:var(--walk)}
.kpi.brand{border-top-color:var(--brand)} .kpi.brand .v{color:var(--brand-2)}

.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--soft-2);border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.c-ok{background:var(--ok-bar)} .c-late{background:var(--late-bar)} .c-bad{background:var(--bad-bar)}
.c-walk{background:var(--walk-bar)} .c-wait{background:var(--wait-bar)}
.bar-mini{height:9px;border-radius:5px;background:var(--soft-2);overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--ok-bar)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-2);background:#fff;border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-size:15px}
.tab[aria-selected="true"]{color:var(--brand-2);border-bottom-color:var(--brand)}

/* 預約 */
.search{display:flex;gap:10px;flex-wrap:wrap}
.search .inp{flex:1;min-width:240px;position:relative}
.search .inp input{width:100%;height:54px;font-size:19px;padding-left:46px;font-family:var(--f-mono);text-transform:uppercase;border-width:2px}
.search .inp input::placeholder{font-family:var(--f-body);text-transform:none;font-size:16px}
.search .inp .ic{position:absolute;left:14px;top:15px;color:var(--ink-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.opt b{font-size:16px} .opt small{color:var(--ink-3);font-size:13px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.slotrow{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.hourlab{font-family:var(--f-mono);font-weight:600;color:var(--ink-2);font-size:14px}
.slots{display:grid;gap:8px}
.slot{border:1.5px solid var(--line-2);background:#fff;border-radius:8px;padding:6px 4px;cursor:pointer;display:grid;text-align:center;line-height:1.3}
.slot .st{font-family:var(--f-mono);font-weight:600;font-size:15px}
.slot .sc{font-size:12px;color:var(--ok);font-weight:700}
.slot[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.slot[aria-pressed="true"] .sc{color:#fff}
.slot:disabled{background:var(--soft);border-style:dashed;border-color:var(--line);cursor:not-allowed;color:var(--ink-3)}
.slot:disabled .sc{color:var(--ink-3)}
.polist{display:flex;gap:6px;flex-wrap:wrap}
.potag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:600;font-size:13.5px;border:1.5px solid var(--line-2);border-radius:6px;padding:2px 4px 2px 9px}
.potag button{border:0;background:var(--soft);border-radius:4px;cursor:pointer;width:22px;height:22px;display:grid;place-items:center}
.sticky{position:sticky;top:84px}

/* 滿版 */
.kiosk{min-height:100vh;display:flex;flex-direction:column;background:#fff}
.kbar{display:flex;align-items:center;gap:14px;padding:8px 18px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.kbar .brandmark .sys{font-size:18px} .kbar .logo{width:38px;height:38px}
.kbar .title{font-size:22px;font-weight:900;padding-left:14px;border-left:2px solid var(--line)}
.kbody{flex:1;padding:18px 22px}
.gate{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px;align-items:start}
.scanbox input{width:100%;height:84px;font-size:36px;font-family:var(--f-mono);font-weight:600;text-transform:uppercase;border:3px solid var(--ink);border-radius:12px;padding:0 22px}
.scanbox input::placeholder{font-size:22px;font-family:var(--f-body);font-weight:500;text-transform:none}
.scanbox input:focus{outline:4px solid var(--brand-line);border-color:var(--brand)}
.verdict{border-radius:14px;border:3px solid var(--line);padding:22px 26px;margin-top:16px;min-height:300px}
.verdict .big{font-size:58px;font-weight:900;line-height:1.1;display:flex;align-items:center;gap:14px}
.verdict .sub{font-size:20px;font-weight:600;margin-top:8px}
.verdict.idle{display:grid;place-items:center;text-align:center;color:var(--ink-3);border-style:dashed}
.verdict.idle .big{font-size:30px;color:var(--ink-2);justify-content:center}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok-bar)} .verdict.ok .big{color:var(--ok)}
.verdict.late{background:var(--late-soft);border-color:var(--late-bar)} .verdict.late .big{color:var(--late)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad-bar)} .verdict.bad .big{color:var(--bad);font-size:40px}
.verdict.dup{background:var(--brand-soft);border-color:var(--brand)} .verdict.dup .big{color:var(--brand-2);font-size:44px}
.pager{display:inline-flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 20px;margin-top:16px}
.pager .l{font-size:18px;font-weight:700} .pager .n{font-size:52px;font-weight:600;font-family:var(--f-mono);line-height:1.1}
.reslot{margin-top:14px;font-size:22px;font-weight:700;background:#fff;border:2.5px solid var(--late-bar);border-radius:10px;padding:10px 16px;color:var(--late)}
.qrwrap{display:grid;justify-items:center;gap:8px;text-align:center}
.qrwrap .qr{padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}

/* 看板 */
.hours{display:grid;gap:6px}
.hour{display:grid;grid-template-columns:66px 150px minmax(0,1fr);gap:12px;align-items:center;padding:7px 10px;border-radius:8px;border:1.5px solid transparent}
.hour.now{border-color:var(--brand);background:var(--brand-soft)}
.hour .h{font-family:var(--f-mono);font-weight:600;font-size:16px}
.cap{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--ink-2)}
.vchips{display:flex;gap:5px;flex-wrap:wrap}
.vchip{font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 7px;border:1.5px solid;font-family:var(--f-mono);white-space:nowrap}
.vchip.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.vchip.late{color:var(--late);background:var(--late-soft);border-color:var(--late-line)}
.vchip.bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-line)}
.vchip.walk{color:var(--walk);background:var(--walk-soft);border-color:var(--walk-line)}
.vchip.wait{color:var(--wait);background:#fff;border-color:var(--line-2)}
.feed{display:grid}
.feed>div{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--soft-2)}
.feed>div:last-child{border-bottom:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ok)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok-bar);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}

/* 分析圖 */
.hchart{display:flex;align-items:flex-end;gap:8px;height:210px;padding:10px 4px 0;border-bottom:2px solid var(--ink-2)}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:26px}
.hcol .tot{font-size:12.5px;font-weight:700;font-family:var(--f-mono);margin-bottom:3px}
.hcol .bars{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.hlabels{display:flex;gap:8px;padding:5px 4px 0}
.hlabels span{flex:1;min-width:26px;text-align:center;font-size:12px;font-family:var(--f-mono);font-weight:600;color:var(--ink-2)}

/* 手機候位 */
.phone-stage{min-height:100vh;background:var(--soft);display:grid;justify-items:center;align-content:start;padding:18px 12px}
.phone{width:100%;max-width:430px;background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;min-height:720px}
.phone .ph{padding:14px 18px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:10px}
.phone .pb{padding:18px}
.phone h2{margin:0 0 4px;font-size:24px;font-weight:900}
.phone .slot{padding:12px 6px}
.phone .slot .st{font-size:18px}
@media (max-width:520px){.phone-stage{padding:0;background:#fff}.phone{border:0;border-radius:0}}

/* 預約單 */
#layer .scrim{position:fixed;inset:0;background:rgba(11,18,32,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto;border:2px solid var(--ink)}
.ticket{padding:22px 24px}
.ticket .th{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px;align-items:flex-end}
.ticket .co{font-weight:900;font-size:17px;line-height:1.3}
.ticket .co small{display:block;font-size:13px;font-weight:700;color:var(--ink-2)}
.ticket .bigid{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.1}
.codes{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:16px 0 6px;padding:14px;border:1.5px solid var(--line);border-radius:10px}
.bc{display:grid;justify-items:center;gap:2px;min-width:0}
.bc svg{max-width:100%;height:64px}
.bc .hr{font-family:var(--f-mono);font-weight:600;font-size:18px;letter-spacing:.12em}
.rules ol{margin:12px 0 0;padding-left:20px;display:grid;gap:4px;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.openq{padding:10px 0;border-bottom:1px solid var(--soft-2)} .openq:last-child{border-bottom:0}
.openq p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
ol.plain{margin:0;padding-left:20px;display:grid;gap:8px}
.copybtn{border:1.5px solid var(--line-2);background:#fff;border-radius:6px;height:28px;padding:0 8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700}
.copybtn:hover{background:var(--brand-soft);border-color:var(--brand)}

@media (max-width:980px){
  .gate{grid-template-columns:1fr}
  .split2{grid-template-columns:1fr!important}
  .sticky{position:static}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1.5px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
  .rail-group{display:none}
  .navrow{flex:none} .navbtn{white-space:nowrap} .navbtn .tag,.newtab{display:none}
  main.wrap{padding:18px 16px 50px}
  .topbar{padding:8px 16px}
  .hour{grid-template-columns:56px 1fr}.hour .vchips{grid-column:1/-1}
  .verdict .big{font-size:40px}
  .scanbox input{font-size:26px;height:68px}
  .codes{grid-template-columns:1fr;justify-items:center}
}
@media print{
  body *{visibility:hidden}
  #layer .ticket,#layer .ticket *{visibility:visible}
  #layer .scrim{position:absolute;inset:0;background:#fff;display:block;padding:0}
  #layer .modal{border:0;max-height:none}
  .noprint{display:none!important}
}

<script>
"use strict";
/*CORE-BEGIN*/
const BRAND={co:"範例物流股份有限公司",sys:"進貨預約系統"};
/* v3：拿掉貨運業者、車牌選填、一張採購單只能預約一次、候位分手機／代為。舊資料結構不同，換 key 讓大家拿到新種子。 */
const KEY="tdc-plan-d-v3";

/* ── 工具 ───────────────────────────── */
const pad=n=>String(n).padStart(2,"0");
const hhmm=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const toMin=s=>{const[a,b]=s.split(":").map(Number);return a*60+b};
const WD=["日","一","二","三","四","五","六"];
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dshow=s=>{const d=new Date(s+"T00:00:00");return s.replace(/-/g,"/")+" ("+WD[d.getDay()]+")"};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return dstr(d)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── 主檔 ───────────────────────────── */
/* 車型只分兩類：非鷗翼靠碼頭、鷗翼在廣場。兩池名額各自獨立，不互相挪用。 */
const GROUPS=[
  {id:"dock",name:"非鷗翼車",stand:"碼頭",hint:"靠碼頭下貨"},
  {id:"wing",name:"鷗翼車",  stand:"廣場",hint:"廣場下貨"}
];
const grp=id=>GROUPS.find(g=>g.id===id)||GROUPS[0];

const SUPPLIERS=[
  {code:"V231",name:"甲上食品"},{code:"V518",name:"乙誠食品"},{code:"V742",name:"丙原冷凍"},
  {code:"V863",name:"丁豐農產"},{code:"V102",name:"戊記飲料"},{code:"V305",name:"己新日用"},
  {code:"V417",name:"庚和紙業"},{code:"V629",name:"辛泰家品"},{code:"V754",name:"壬光乳品"},
  {code:"V980",name:"癸隆雜糧"}
];
const supplierOf=c=>SUPPLIERS.find(x=>x.code===c)||{code:c,name:"—"};

function defaultConfig(){
  return{
    graceMin:10,          // 報到晚於預約時段起始這麼多分鐘內，仍算準點
    noShowAfterMin:30,    // 時段結束再過這麼久仍未報到，判定未到
    walkinLeadMin:0,      // 現場給時段時，從「現在＋這麼多分鐘」之後才起算
    noBookingNote:"低溫進貨集中在夜間時段，現場沒有排隊問題，因此第一階段不納入預約。",
    dcs:[
      {code:"N",name:"北區物流中心",warehouses:[
        {id:"N1",name:"常溫倉",temp:"常溫",booking:true,pools:{
          dock:{open:"08:00",close:"15:00",split:3,capacity:3},
          wing:{open:"08:00",close:"15:00",split:2,capacity:1}}},
        {id:"C1",name:"低溫倉",temp:"低溫",booking:false,pools:{
          dock:{open:"18:00",close:"23:00",split:4,capacity:2},
          wing:{open:"18:00",close:"23:00",split:1,capacity:1}}}
      ]},
      {code:"M",name:"中區物流中心",warehouses:[
        {id:"N1",name:"常溫倉",temp:"常溫",booking:true,pools:{
          dock:{open:"07:00",close:"14:00",split:4,capacity:2},
          wing:{open:"07:00",close:"14:00",split:1,capacity:1}}}
      ]}
    ]
  };
}
const dcOf=code=>S.cfg.dcs.find(d=>d.code===code);
const whOf=(dc,id)=>dcOf(dc)?.warehouses.find(w=>w.id===id);
const poolOf=(dc,wh,g)=>whOf(dc,wh)?.pools[g];

/* ── 時段與名額 ───────────────────────────── */
function slotsOf(dc,wh,g){
  const p=poolOf(dc,wh,g); if(!p)return [];
  const st=toMin(p.open),en=toMin(p.close),step=60/p.split,out=[];
  for(let t=st;t+step<=en;t+=step)out.push({start:t,end:t+step});
  return out;
}
/* 名額：同 DC＋同倉＋同池＋同日＋同時段的有效預約數。
   遲到者改到的第二時段（lateSlot）與現場候位同樣佔一格——那台車實際會用掉碼頭。 */
function usedAt(dc,wh,g,date,start,excludeId){
  return S.bookings.filter(b=>b.date===date&&b.dc===dc&&b.wh===wh&&b.group===g
    &&b.status!=="cancelled"&&b.id!==excludeId
    &&(b.slot===start||b.lateSlot===start)).length;
}
function remainAt(dc,wh,g,date,start,excludeId){
  return (poolOf(dc,wh,g)?.capacity||0)-usedAt(dc,wh,g,date,start,excludeId);
}
const isFuture=(date,start)=>date>S.simDate||(date===S.simDate&&start>S.simMin);

/* ── 查找 ───────────────────────────── */
const norm=s=>String(s||"").trim().toUpperCase();
const orderOf=po=>{const k=norm(po);return S.orders.find(o=>o.po===k)};
const bookingById=id=>{const k=norm(id);return S.bookings.find(b=>b.id===k)};
/* 一張採購單只能用來預約一次——主單與同車其他單都算。 */
const bookingOfPO=po=>{const k=norm(po);return S.bookings.find(b=>b.status!=="cancelled"&&b.poRefs.includes(k))};
/* 有填車牌時，同車同日同物流中心也不可重複預約。車牌空白不比對。 */
const bookingOfTruck=(plate,date,dc)=>plate?S.bookings.find(b=>b.plate===plate&&b.date===date&&b.dc===dc&&b.status!=="cancelled"):null;

/* ── 判定 ─────────────────────────────
   現場候位不進準點率：他本來就沒預約，當場報到必然「準時」，
   混進分母會讓沒預約的人準點率 100%，先預約的人反而被扣分。 */
const isWalkin=b=>b.source==="walkin";
function punctuality(b){
  if(isWalkin(b))return null;
  if(b.status==="noshow")return"noshow";
  if(b.status!=="arrived"||b.checkinAt==null)return null;
  return b.checkinAt<=b.slot+S.cfg.graceMin?"ontime":"late";
}
const PLABEL={ontime:"準點",late:"遲到",noshow:"未到"};
const lateBy=b=>Math.max(0,(b.checkinAt??0)-b.slot);
const bookableWh=dc=>dcOf(dc)?.warehouses.find(w=>w.booking)||null;
/* 當日該倉該車型，從現在（＋緩衝）之後仍有名額的時段，由近到遠。 */
function openSlotsNow(dc,wh,g){
  const from=S.simMin+(S.cfg.walkinLeadMin||0);
  return slotsOf(dc,wh,g).filter(x=>x.start>=from&&remainAt(dc,wh,g,S.simDate,x.start)>0);
}
function autoNoShow(){
  let ch=false;
  S.bookings.forEach(b=>{
    if(b.status!=="booked")return;
    if(b.date<S.simDate||(b.date===S.simDate&&S.simMin>b.end+S.cfg.noShowAfterMin)){b.status="noshow";ch=true}
  });
  return ch;
}
const nextPager=(dc,date)=>"P-"+pad(S.bookings.filter(x=>x.dc===dc&&x.date===date&&x.pager).length+1);
function newId(dc,date){
  const pre=dc+"-"+date.slice(5).replace("-","")+"-";
  let n=S.bookings.filter(b=>b.dc===dc&&b.date===date).length+1;
  while(bookingById(pre+pad(n)))n++;
  return pre+pad(n);
}

/* ── 種子資料 ─────────────────────────────

  return out;
})();

    poSeq[date]=(poSeq[date]||0)+1;
    const po="PO-"+date.slice(2).replace(/-/g,"")+"-"+String(poSeq[date]).padStart(3,"0");

    return po;
  };
  let supN=0;
  const nextSup=()=>SUPPLIERS[(supN++*3)%SUPPLIERS.length].code;

  const room=(dc,g,date,slot)=>poolOf(dc,WH,g).capacity-(used[key(dc,g,date,slot)]||0);
  const take=(dc,g,date,slot)=>{const k=key(dc,g,date,slot);used[k]=(used[k]||0)+1};
  const mk=o=>{
    const k=o.dc+"|"+o.date; idSeq[k]=(idSeq[k]||0)+1;
    const step=60/poolOf(o.dc,WH,o.g).split;
    const b={id:o.dc+"-"+o.date.slice(5).replace("-","")+"-"+pad(idSeq[k]),
      dc:o.dc,wh:WH,group:o.g,date:o.date,slot:o.slot,end:o.slot+step,plate:o.plate||"",
      poRefs:o.pos||[],status:o.st||"booked",checkinAt:o.ci??null,pager:null,
      source:o.st==="walkin"?"walkin":"online",via:o.via||null,
      lateSlot:null,lateEnd:null,createdAt:0};
    take(o.dc,o.g,o.date,o.slot);
    if(o.ls!=null){b.lateSlot=o.ls;b.lateEnd=o.ls+step;take(o.dc,o.g,o.date,o.ls)}
    bookings.push(b);return b;
  };
  /* 手排的一筆：[車型, 時段, 車牌, 採購單張數, 狀態, 過刷, 改排時段, 候位方式] */
  const hand=(dc,date,rows)=>rows.forEach(([g,t,plate,npo,st,ci,ls,via])=>{
    const pos=[];for(let j=0;j<npo;j++)pos.push(mkPO(nextSup(),dc,WH,date));
    mk({dc,g,date,slot:toMin(t),plate,pos,st,ci:ci?toMin(ci):null,ls:ls?toMin(ls):null,via});
  });

  /* 歷史：07/01 起到演練日前一天，週日休。週一刻意偏差，讓每日趨勢看得出規律。 */
  let d="2026-07-01",di=0;
  while(d<TODAY){
    const dow=new Date(d+"T00:00:00").getDay();
    if(dow!==0){
      [["N",0],["M",1]].forEach(([dc,off])=>{
        const n=(dc==="N"?13:10)+((di*3+off)%5)-(dow===6?5:0);
        const lateP=dow===1?30:16, nsP=dow===1?10:5;
        for(let k=0;k<n;k++){
          const g=(k%6===5)?"wing":"dock", sl=slotsOf(dc,WH,g);
          let si=(k*5+di*3+off)%sl.length,tries=0;
          while(room(dc,g,d,sl[si].start)<=0&&tries<sl.length){si=(si+1)%sl.length;tries++}
          if(tries>=sl.length)continue;
          const s=sl[si].start, h=(di*37+k*53+off*11)%100;
          const kind=h<nsP?"noshow":(h<nsP+lateP?"late":"ontime");
          const pos=[];for(let j=0;j<((k%7===3)?2:1);j++)pos.push(mkPO(SUPPLIERS[(di+k*3+j+off)%10].code,dc,WH,d));
          const ev={dc,g,date:d,slot:s,plate:(k%10<7)?PLATE_POOL[(di+k*2+off)%PLATE_POOL.length]:"",pos};
          if(kind==="noshow")ev.st="noshow";
          else if(kind==="late"){
            ev.st="arrived";ev.ci=s+11+((di+k)%25);
            const ni=si+2+((di+k)%3);
            if(ni<sl.length&&room(dc,g,d,sl[ni].start)>0)ev.ls=sl[ni].start;
          }else{ev.st="arrived";ev.ci=s-8+((di*7+k*3)%18)}
          mk(ev);
        }
        const wn=Math.max(0,((di*3+off*2)%4)-(dow===6?1:0));
        const sl=slotsOf(dc,WH,"dock");
        for(let k=0;k<wn;k++){
          let si=(k*9+di*5+off+7)%sl.length,tries=0;
          while(room(dc,"dock",d,sl[si].start)<=0&&tries<sl.length){si=(si+1)%sl.length;tries++}
          if(tries>=sl.length)continue;
          const s=sl[si].start;
          mk({dc,g:"dock",date:d,slot:s,plate:(k%2)?"":String(1000+((di*131+k*71)%9000)),pos:[],
              st:"walkin",ci:s-10-((di+k)%20),via:(di+k)%3===0?"guard":"phone"});
        }
      });
    }
    d=addDays(d,1);di++;
  }

  /* 演練日：北區（碼頭每 20 分 3 位、廣場每 30 分 1 位），模擬時間 09:10。 */

  /* 中區（碼頭每 15 分 2 位、廣場每小時 1 位）。 */
  hand("M",TODAY,[
    ["dock","07:00","GTR-1102",1,"arrived","06:58"],

}

/* ── Code128-B 一維條碼 ─────────────────────────────
   一維條碼槍讀不了 QRcode，所以預約單兩種都印。內容就是預約單號，與手輸的字串完全相同。 */
const C128=("212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 "+
  "123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 "+
  "111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 "+
  "231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 "+
  "141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 "+
  "124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 "+
  "311141 411131 211412 211214 211232 2331112").split(" ");
function code128(text,h=62){
  const vals=[104];
  for(const ch of String(text)){const c=ch.charCodeAt(0);if(c>=32&&c<=126)vals.push(c-32)}
  let sum=104;for(let i=1;i<vals.length;i++)sum+=vals[i]*i;
  vals.push(sum%103);vals.push(106);
  let x=10,r="";
  vals.forEach(v=>{const p=C128[v];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)r+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w}});
  const W=x+10;
  return `<svg viewBox="0 0 ${W} ${h}" width="${W*2}" height="${h}" preserveAspectRatio="none" shape-rendering="crispEdges" role="img" aria-label="條碼 ${esc(text)}"><rect width="${W}" height="${h}" fill="#fff"/><g fill="#000">${r}</g></svg>`;
}
function drawQR(el,text,size){
  if(!el)return;
  try{if(window.QRCode){el.innerHTML="";new QRCode(el,{text,width:size,height:size,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});return}}catch(e){}
  el.innerHTML=`<div class="muted" style="width:${size}px;height:${size}px;display:grid;place-items:center;border:1.5px dashed var(--line-2)">QRcode 載入失敗</div>`;
}

function runSearch(raw){
  let q=String(raw||"").trim();
  const m=q.match(/[?&]id=([^&#]+)/); if(m)q=decodeURIComponent(m[1]);
  q=q.toUpperCase();
  U={q};
  if(!q){U.msg="請輸入採購單號、預約單號或車牌。";return}
  const b=bookingById(q);
  if(b){U.mode="found";U.found=[b.id];return}
  const o=orderOf(q);
  if(o){
    const bk=bookingOfPO(o.po);
    if(bk){
      U.mode="found";U.found=[bk.id];U.msgKind="brand";
      U.msg=`採購單 <b class="mono">${o.po}</b> 已經預約過${bk.poRefs[0]!==o.po?`（以同車其他單的身分，主單為 <span class="mono">${bk.poRefs[0]}</span>）`:""}，以下是這張預約。<b>一張採購單只能預約一次。</b>`;
      return;
    }
    if(!o.valid){U.msg=`採購單 <b class="mono">${o.po}</b> 已作廢，無法預約。`;U.msgKind="bad";return}
    if(o.date<S.simDate){U.msg=`採購單 <b class="mono">${o.po}</b> 的指定進貨日 ${dshow(o.date)} 已過，無法預約。`;U.msgKind="bad";return}
    const w=whOf(o.dc,o.wh);
    if(!w.booking){U.msg=`採購單 <b class="mono">${o.po}</b> 的收貨倉別是 <b>${w.temp}・${esc(w.name)}</b>，<b>目前不需預約</b>。${S.cfg.noBookingNote}請依原有方式直接到廠卸貨。`;U.msgKind="brand";return}
    Object.assign(U,{mode:"book",order:o.po,group:"dock",slot:null,extras:[],plate:""});
    return;
  }
  const list=S.bookings.filter(x=>x.plate===q&&x.status!=="cancelled"&&x.date>=S.simDate)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.slot-b.slot);
  if(list.length){U.mode="found";U.found=list.map(x=>x.id);U.msgKind="brand";U.msg=`車牌 <b class="mono">${esc(q)}</b> 今日起共有 ${list.length} 筆預約。`;return}
  U.msg=S.bookings.some(x=>x.plate===q)
    ?`車牌 <b class="mono">${esc(q)}</b> 查無今日以後的預約（只有過去的紀錄）。`
    :"查無此採購單號、預約單號或車牌。請確認供應商提供的採購單號是否正確。";
}

function addExtra(){
  const o=orderOf(U.order), v=norm($("#extraIn").value);
  U.exErr="";
  const x=orderOf(v), used=x&&bookingOfPO(x.po);
  if(!v)U.exErr="請輸入採購單號。";
  else if(!x)U.exErr="查無此採購單號。";
  else if(!x.valid)U.exErr=x.po+" 已作廢。";
  else if(x.po===o.po)U.exErr="這已經是主要採購單。";
  else if(U.extras.includes(x.po))U.exErr=x.po+" 已加入。";
  else if(used)U.exErr=`${x.po} 已在預約 <span class="mono">${used.id}</span> 中使用，一張採購單只能預約一次。`;
  else if(x.dc!==o.dc||x.date!==o.date||x.wh!==o.wh)U.exErr=x.po+" 的收貨中心、倉別或進貨日不同，無法併在同一車。";
  else U.extras.push(x.po);
  render();
  const el=$("#extraIn");if(el&&!U.exErr)el.focus();
}
function confirmBooking(){
  const o=orderOf(U.order),g=grp(U.group),plate=norm(U.plate);
  U.bookErr="";
  if(U.slot==null)return;
  if(plate&&!/^[A-Z0-9-]{2,12}$/.test(plate)){U.bookErr="車牌請填 2～12 碼英數字，可含連字號；不確定可以留白。";render();return}
  const usedPo=[o.po,...U.extras].find(p=>bookingOfPO(p));
  if(usedPo){U.bookErr=`採購單 ${usedPo} 剛剛已被預約（${bookingOfPO(usedPo).id}），請重新查詢。`;render();return}
  const dup=bookingOfTruck(plate,o.date,o.dc);
  if(dup){U.bookErr=`車牌 ${plate} 在${dcOf(o.dc).name} ${dshow(o.date)} 已有預約 <span class="mono">${dup.id}</span>，同一台車同日同物流中心不可重複預約。`;render();return}
  if(remainAt(o.dc,o.wh,g.id,o.date,U.slot)<=0||!isFuture(o.date,U.slot)){
    U.slot=null;U.bookErr="此時段剛被訂走或已過時，請改選其他時段。";render();return}
  const step=60/poolOf(o.dc,o.wh,g.id).split;
  const b={id:newId(o.dc,o.date),dc:o.dc,wh:o.wh,group:g.id,date:o.date,slot:U.slot,end:U.slot+step,plate,
    poRefs:[o.po,...U.extras],status:"booked",checkinAt:null,pager:null,source:"online",via:null,
    lateSlot:null,lateEnd:null,createdAt:Date.now()};
  S.bookings.push(b);save();
  U={q:o.po,mode:"found",found:[b.id],msgKind:"ok",msg:`${ic("check",16,2.6)} 預約成立，預約單號 <b class="mono">${b.id}</b>。`};
  render();showTicket(b.id);
}

function createWalkin(dc,g,slot,digits,via){

  if(slot==null)return"請先選擇進場時段。";
  if(remainAt(dc,w.id,g,S.simDate,slot)<=0||slot<S.simMin+(S.cfg.walkinLeadMin||0))return"此時段剛被佔用或已過時，請改選。";
  const step=60/poolOf(dc,w.id,g).split;
  const b={id:newId(dc,S.simDate),dc,wh:w.id,group:g,date:S.simDate,slot,end:slot+step,plate:digits||"",poRefs:[],
    source:"walkin",via,status:"walkin",checkinAt:S.simMin,pager:nextPager(dc,S.simDate),
    lateSlot:null,lateEnd:null,createdAt:Date.now()};
  S.bookings.push(b);save();
  return b;
}

function doScan(raw){
  const dc=curDc();
  let q=String(raw||"").trim();
  const m=q.match(/[?&]id=([^&#]+)/); if(m)q=decodeURIComponent(m[1]);
  q=q.toUpperCase();
  U={};
  if(!q){render();return}
  const fail=msg=>{U.kind="err";U.msg=msg;render()};
  let b=bookingById(q);
  if(!b){
    const o=orderOf(q);
    if(o){b=bookingOfPO(o.po);if(!b)return fail(`採購單 <span class="mono">${o.po}</span> 沒有預約紀錄。未預約的車請走右側現場候位。`)}
  }
  if(!b){
    const hits=S.bookings.filter(x=>x.plate&&x.plate===q&&x.date===S.simDate&&x.status!=="cancelled");
    b=hits.find(x=>x.dc===dc)||hits[0];
  }
  if(!b)return fail(`查無 <span class="mono">${esc(q)}</span>。請確認預約單號、採購單號或車牌。`);
  if(b.date!==S.simDate)return fail(`<span class="mono">${b.id}</span> 的進貨日是 ${dshow(b.date)}，不是今天。`);
  if(b.dc!==dc)return fail(`<span class="mono">${b.id}</span> 的收貨地點是${dcOf(b.dc).name}，不是本物流中心。`);
  if(b.status==="arrived"||isWalkin(b)){U.kind="dup";U.hit=b.id;render();return}
  /* 過刷即報到並立即判定。判定遲到時，當下就給當天最快的可進場時段——人已經在現場，不必再輸採購單號。
     原單維持「遲到」：遲到就結案，不另外產生一筆預約，報表不會被稀釋。 */
  b.status="arrived";b.checkinAt=S.simMin;b.pager=nextPager(b.dc,b.date);b.createdAt=Date.now();
  b.lateSlot=null;b.lateEnd=null;
  const pu=punctuality(b);
  if(pu==="late"){const nx=openSlotsNow(b.dc,b.wh,b.group)[0];if(nx){b.lateSlot=nx.start;b.lateEnd=nx.end}}
  save();
  U.kind=pu;U.hit=b.id;render();
}

V.board=()=>{
  const dc=curDc(), w=bookableWh(dc);
  const today=S.bookings.filter(b=>b.dc===dc&&b.date===S.simDate&&b.status!=="cancelled");
  const online=today.filter(b=>!isWalkin(b)), walk=today.filter(isWalkin);
  const c={ontime:0,late:0,noshow:0,wait:0};
  online.forEach(b=>c[statusOf(b)]++);
  const arrived=c.ontime+c.late, tot=online.length||1, pct=Math.round(arrived/tot*100);
  const overdue=online.filter(b=>b.status==="booked"&&S.simMin>b.slot+S.cfg.graceMin).sort((a,b)=>a.slot-b.slot);
  const upcoming=online.filter(b=>b.status==="booked"&&S.simMin<=b.slot+S.cfg.graceMin&&b.slot<=S.simMin+60).sort((a,b)=>a.slot-b.slot);
  const feed=today.filter(b=>b.checkinAt!=null).sort((a,b)=>b.checkinAt-a.checkinAt||(b.createdAt-a.createdAt)).slice(0,8);
  const seg=(n,cls)=>n?`<i class="${cls}" style="width:${n/tot*100}%" title="${n}"></i>`:"";
  const hours=[];
  if(w){
    const ps=GROUPS.map(g=>poolOf(dc,w.id,g.id));
    const h0=Math.min(...ps.map(p=>toMin(p.open))), h1=Math.max(...ps.map(p=>toMin(p.close)));
    for(let h=h0;h<h1;h+=60){
      const caps=GROUPS.map(g=>{const sl=slotsOf(dc,w.id,g.id).filter(s=>s.start>=h&&s.start<h+60);
        return{g,used:sl.reduce((a,s)=>a+usedAt(dc,w.id,g.id,S.simDate,s.start),0),cap:sl.length*poolOf(dc,w.id,g.id).capacity}});
      const inH=today.filter(b=>(b.slot>=h&&b.slot<h+60)||(b.lateSlot!=null&&b.lateSlot>=h&&b.lateSlot<h+60))
        .sort((a,b)=>((a.lateSlot>=h&&a.lateSlot<h+60)?a.lateSlot:a.slot)-((b.lateSlot>=h&&b.lateSlot<h+60)?b.lateSlot:b.slot));
      const now=S.simMin>=h&&S.simMin<h+60;
      hours.push(`<div class="hour ${now?"now":""}"><div class="h">${hhmm(h)}${now?`<div style="font-size:11px;color:var(--brand-2);font-family:var(--f-body);font-weight:900">現在</div>`:""}</div>
        <div class="cap">${caps.map(x=>`<div>${x.g.stand} ${x.used}/${x.cap}<div class="bar-mini"><i style="width:${x.cap?Math.min(100,x.used/x.cap*100):0}%;background:${x.used>=x.cap?"var(--bad-bar)":"var(--brand)"}"></i></div></div>`).join("")}</div>
        <div class="vchips">${inH.map(b=>{const re=b.lateSlot!=null&&b.lateSlot>=h&&b.lateSlot<h+60;const s=statusOf(b);
          const od=s==="wait"&&S.simMin>b.slot+S.cfg.graceMin;
          return `<span class="vchip ${od?"bad":SCLS[s]}" title="${b.id}｜${SLABEL[s]}｜${b.plate||"未填車牌"}">${re?"↻"+hhmm(b.lateSlot):hhmm(b.slot)} ${esc(b.plate||"#"+b.id.slice(-2))}${b.group==="wing"?"・廣":""}</span>`}).join("")||`<span class="muted" style="font-size:13px">—</span>`}</div></div>`);
    }
  }
  const mini=(list,empty,fmt)=>list.length?list.map(fmt).join(""):`<div class="muted" style="display:block;text-align:center">${empty}</div>`;
  return `<div class="kiosk">${kbar("即時看板","board")}<div class="kbody grid" style="gap:16px">
    <div class="kpis">
      <div class="kpi brand"><div class="l">${ic("calendar",16)}今日預約</div><div class="v">${online.length}</div><div class="s">車次（不含現場候位）</div></div>
      <div class="kpi brand"><div class="l">${ic("check",16)}已報到</div><div class="v">${arrived}</div><div class="s">報到進度 ${pct}%</div></div>
      <div class="kpi ok"><div class="l">準點</div><div class="v">${c.ontime}</div></div>
      <div class="kpi late"><div class="l">遲到</div><div class="v">${c.late}</div></div>
      <div class="kpi bad"><div class="l">未到</div><div class="v">${c.noshow}</div></div>
      <div class="kpi"><div class="l">${ic("clock",16)}待報到</div><div class="v">${c.wait}</div><div class="s">其中逾時 ${overdue.length}</div></div>
      <div class="kpi walk"><div class="l">${ic("phone",16)}現場候位</div><div class="v">${walk.length}</div><div class="s">手機 ${walk.filter(b=>b.via!=="guard").length}・代為 ${walk.filter(b=>b.via==="guard").length}</div></div>
    </div>
    <div class="card pad grid" style="gap:8px">
      <div class="row"><b style="font-size:16px">今日報到進度</b><span class="muted" style="font-weight:700">已報到 ${arrived} / 預約 ${online.length}</span><div class="spacer"></div>
        <div class="legend"><span><i class="c-ok"></i>準點 ${c.ontime}</span><span><i class="c-late"></i>遲到 ${c.late}</span><span><i class="c-bad"></i>未到 ${c.noshow}</span><span><i class="c-wait"></i>待報到 ${c.wait}</span></div></div>
      <div class="stack" style="height:28px">${seg(c.ontime,"c-ok")}${seg(c.late,"c-late")}${seg(c.noshow,"c-bad")}${seg(c.wait,"c-wait")}</div>
    </div>
    <div class="grid split2" style="grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);align-items:start">
      <div class="card"><div class="card-h"><h3>${ic("clock",19)}各時段進度</h3><div class="spacer"></div>
        <div class="legend"><span><i class="c-ok"></i>準點</span><span><i class="c-late"></i>遲到</span><span><i class="c-bad"></i>未到／逾時</span><span><i class="c-walk"></i>候位</span><span><i style="background:#fff;border:1.5px solid var(--line-2)"></i>待報到</span><span>↻ 遲到改排</span><span>#末碼＝未填車牌</span><span>・廣＝廣場</span></div></div>
        <div class="pad hours">${hours.join("")||`<div class="muted">此物流中心沒有開放預約的倉別。</div>`}</div></div>

        <div class="card"><div class="card-h"><h3>${ic("truck",19)}60 分鐘內即將到場</h3><div class="spacer"></div><span class="pill wait">${upcoming.length}</span></div>
          <div class="feed">${mini(upcoming,"目前沒有",b=>`<div><b class="mono">${hhmm(b.slot)}</b><div><span class="mono" style="font-weight:600">${b.id}</span>　${plateTxt(b)}</div><span class="muted" style="font-weight:700">${grp(b.group).stand}</span></div>`)}</div></div>
        <div class="card"><div class="card-h"><h3>${ic("list",19)}最新報到</h3></div>
          <div class="feed">${mini(feed,"今日尚無報到",b=>`<div><b class="mono">${hhmm(b.checkinAt)}</b><div><span class="mono" style="font-weight:600">${b.id}</span>　${plateTxt(b)}</div><div>${statusPill(b)}</div></div>`)}</div></div>

/* ═════════ 5. 報到分析（後台） ═════════ */
function tally(list){
  const t={online:0,ontime:0,late:0,noshow:0,wait:0,walkin:0,phone:0,guard:0,relate:0};
  list.forEach(b=>{
    if(b.status==="cancelled")return;
    const s=statusOf(b);
    if(s==="walkin"){t.walkin++;b.via==="guard"?t.guard++:t.phone++;return}
    t.online++;t[s]++;if(b.lateSlot!=null)t.relate++;
  });
  t.total=t.online+t.walkin;
  const judged=t.ontime+t.late+t.noshow;
  t.rate=judged?Math.round(t.ontime/judged*100):null;
  return t;
}
const kpiRow=t=>`<div class="kpis">
  <div class="kpi brand"><div class="l">總車次</div><div class="v">${t.total}</div><div class="s">預約 ${t.online}・候位 ${t.walkin}</div></div>
  <div class="kpi ok"><div class="l">準點率</div><div class="v">${t.rate==null?"—":t.rate+"%"}</div><div class="s">準點 ÷（準點＋遲到＋未到）</div></div>
  <div class="kpi ok"><div class="l">準點</div><div class="v">${t.ontime}</div></div>

function exportCsv(){
  const tab=U.tab||"day", dcSel=U.dc||"ALL";
  let list;
  if(tab==="day"){const date=U.date||S.simDate;list=S.bookings.filter(b=>b.date===date)}
  else{
    const period=U.period||(tab==="month"?"2026-08":"2026-Q3");
    list=S.bookings.filter(b=>tab==="month"?b.date.slice(0,7)===period:(b.date.slice(0,4)===period.slice(0,4)&&"Q"+Math.ceil(+b.date.slice(5,7)/3)===period.slice(5)));
  }
  list=list.filter(b=>(dcSel==="ALL"||b.dc===dcSel)&&b.status!=="cancelled").sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.slot-b.slot);
  const lines=["進貨日,物流中心,預約單號,來源,主要採購單,同車其他採購單,供應商,車牌,車型,時段,過刷時間,遲到分鐘,改排進場,判定"];
  list.forEach(b=>{const s=statusOf(b);
    lines.push([b.date,dcOf(b.dc).name,b.id,viaTxt(b),b.poRefs[0]||"",b.poRefs.slice(1).join(" "),
      supNames(b).replace(/、/g," "),b.plate,grp(b.group).name,hhmm(b.slot),b.checkinAt!=null?hhmm(b.checkinAt):"",
      s==="late"?lateBy(b):"",b.lateSlot!=null?hhmm(b.lateSlot):"",SLABEL[s]].join(","))});
  const csv=lines.join("\n");
  $("#layer").innerHTML=`<div class="scrim" id="csvScrim"><div class="modal" style="max-width:720px"><div class="card-h"><h3>${ic("copy",19)}匯出 CSV</h3></div>
    <div class="pad grid" style="gap:10px"><div class="note">共 ${list.length} 筆。複製後貼到 Excel，分隔符號選逗號。</div>
    <textarea id="csvBox" readonly>${esc(csv)}</textarea>

  $("#copyCsv").onclick=()=>copyText(csv,list.length+" 筆");
  $("#closeCsv").onclick=()=>$("#layer").innerHTML="";
  $("#csvScrim").onclick=e=>{if(e.target.id==="csvScrim")$("#layer").innerHTML=""};
}

/* ═════════ 8. 規格與待確認（Demo） ═════════ */
V.spec=()=>head("規格與待確認","2026/09/17 依內部討論改版。以下區分已確認的規則與仍待拍板的項目。","doc")+
 `<div class="note warn" style="margin-bottom:16px">本頁為流程討論用的示範系統，<b>供應商、採購單號、車牌與統計數據皆為測試用虛構資料</b>。</div>
  <div class="grid split2" style="grid-template-columns:1fr 1fr;align-items:start">
   <div class="card"><div class="card-h"><h3>畫面架構</h3></div><div class="pad"><ol class="plain">
     <li><b>預約（查詢＋新增合一）</b>：輸入採購單號，已預約就顯示預約內容，未預約就直接進入預約步驟。也可輸入預約單號或車牌查詢。</li>
     <li><b>手機現場候位</b>：未預約的司機掃廠門口的 QRcode，用自己的手機取得今日時段與震動器號碼。</li>
     <li><b>過刷報到（滿版）</b>：接條碼槍，也可手動輸入。大字顯示準點或遲到。放現場候位 QRcode 與「代為候位」備援。</li>
     <li><b>即時看板（滿版）</b>：當日預約、報到、未到、候位進度，各時段剩餘名額，逾時未到與即將到場。</li>
     <li><b>報到分析（後台）</b>：每日分析（各時段車次、明細）與月報／季報（每日趨勢、需檢討的採購單）。</li>
     <li><b>參數設定（後台）</b>：準點寬限、未到判定、各倉別是否開放預約、時段與名額。</li>
   </ol></div></div>
   <div class="card"><div class="card-h"><h3>已確認的規則</h3></div><div class="pad"><ol class="plain">
     <li><b>申請者是貨運業者</b>，但系統<b>不記錄貨運業者代號</b>；統計以採購單為單位，只看那張單準點、遲到或未到。</li>
     <li><b>一張採購單只能預約一次</b>，主單與同車其他單都算。車牌選填；有填時，同車同日同物流中心不可重複預約。</li>
     <li><b>只過刷一次。</b>廠門口過刷即報到並立即判定，發放震動器。進場順序由警衛人工控管。</li>
     <li><b>準點：過刷不晚於預約時段起始 ${S.cfg.graceMin} 分鐘</b>；時段結束後 ${S.cfg.noShowAfterMin} 分鐘未過刷為未到。</li>
     <li><b>遲到者當場改給當天最快的時段</b>，原單記為遲到後結案，不另產生預約。</li>
     <li><b>現場候位當場給時段、佔名額</b>，不需採購單號，不列入準點率，只計次。司機手機掃 QRcode 為主，手機無法掃描時由警衛代為候位，進場時間人工告知與記錄。</li>
     <li><b>預約單同時印 QRcode 與一維條碼</b>，兩種條碼槍都能讀；單號大字印出，可手動輸入。</li>
     <li><b>第一階段只做常溫</b>，低溫倉的單會提示不需預約；是否開放是參數。</li>
   </ol></div></div>
   <div class="card"><div class="card-h"><h3>待確認</h3></div><div class="pad">
     <div class="openq"><b>現場候位 QRcode 可能被遠端佔位</b><p>目前先不防。QRcode 若被拍下傳給還沒到場的車，對方可以在路上先佔時段。若現場發生，再考慮改成警衛確認後生效，或 QRcode 定時更換。</p></div>
     <div class="openq"><b>同一張採購單分兩台車送</b><p>「一張單只能預約一次」代表第二台車約不到。若分批送貨常見，需要另訂做法（例如允許註記分批）。</p></div>
     <div class="openq"><b>現場條碼槍的種類</b><p>預約單已同時印一維條碼與 QRcode。實際導入前仍需確認現場設備能讀哪一種，並實機測試。</p></div>
     <div class="openq"><b>遲到改排會排擠後面的名額</b><p>目前先到先得。若出現「準時的人反而約不到」，要另訂保留規則。</p></div>
     <div class="openq"><b>改約與取消</b><p>目前不提供。換車、換時段的頻率有多高？若開放，截止時間怎麼訂？</p></div>
     <div class="openq"><b>遲到與未到要不要有後果</b><p>目前純統計。報表要送給誰、是否連動限制預約，尚未決定。</p></div>
     <div class="openq"><b>採購單匯入規格、資料保留天數</b><p>尚未討論，見上線規格文件。</p></div>
   </div></div>
   <div class="card"><div class="card-h"><h3>建議操作順序</h3></div><div class="pad"><ol class="plain">
     <li>左側<b>測試採購單</b>複製一張可預約的單 → 到<b>預約</b>貼上查詢 → 不填車牌、加一張同車其他單、選車型與時段 → 確認。</li>
     <li>再查一次剛剛那張單號，會直接顯示預約內容；查同車其他單也一樣。</li>
     <li>點左側「過刷報到」「即時看板」旁的<b>新分頁</b>圖示，各開一個分頁並排。</li>
     <li>在過刷頁輸入預約單號按 Enter，看判定與震動器；看板分頁會同步更新。</li>
     <li>按<b>＋15 分</b>推進時間，再過刷一筆待報到的單，看遲到判定與當場改排時段。</li>
     <li>過刷頁按<b>模擬手機開啟</b>完成一筆候位；再按<b>代為候位</b>完成一筆，看看板的候位數變化。</li>
     <li>到<b>報到分析</b>看今天，切換到月報，點一天看明細；注意週一的準點率偏低。</li>
   </ol></div></div>
  </div>`;

/* ── 預約單 ─────────────────────────────── */
function showTicket(id){
  const b=bookingById(id); if(!b)return;
  const dc=dcOf(b.dc),w=whOf(b.dc,b.wh),g=grp(b.group);
  $("#layer").innerHTML=`<div class="scrim" id="tScrim"><div class="modal" role="dialog" aria-label="預約單"><div class="ticket">
    <div class="th"><div class="co">${BRAND.co}<small>${BRAND.sys}・${isWalkin(b)?"現場候位單":"進貨預約單"}</small></div>
      <div style="text-align:right"><div class="muted" style="font-size:12px;font-weight:700">預約單號</div><div class="bigid">${b.id}</div></div></div>
    <div class="codes"><div id="tQr"></div>
      <div class="bc">${code128(b.id)}<div class="hr">${b.id}</div><div class="muted" style="font-size:12px;font-weight:600">條碼槍掃不到時，請手動輸入上方單號</div></div></div>
    <dl class="kv" style="margin-top:12px">
      <dt>採購單</dt><dd class="mono" style="font-weight:600">${b.poRefs.length?b.poRefs.join("<br>"):"—（現場候位）"}</dd>
      <dt>車牌</dt><dd>${plateTxt(b)}</dd>
      <dt>收貨</dt><dd>${esc(dc.name)}　${w.temp}・${esc(w.name)}</dd>
      <dt>進貨日</dt><dd class="mono">${dshow(b.date)}</dd>
      <dt>${isWalkin(b)?"進場時段":"預約時段"}</dt><dd class="mono" style="font-weight:700;font-size:18px">${hhmm(b.slot)}–${hhmm(b.end)}</dd>
      <dt>車型</dt><dd>${g.name}（${g.stand}下貨）</dd>
      ${b.pager?`<dt>震動器</dt><dd class="mono" style="font-weight:700">${b.pager}</dd>`:""}
    </dl>
    <div class="rules"><ol>${isWalkin(b)?`
      <li>已在現場完成候位，<b>不需再過刷</b>，請依時段與現場人員指示進場。</li>
      <li>本次不列入準點率，會計入現場候位次數。下次請事先線上預約。</li>`:`
      <li>請於 <b>${hhmm(b.slot)}</b> 前抵達廠門口過刷，晚到 ${S.cfg.graceMin} 分鐘內仍算準點。</li>
      <li>過刷後領取震動器，依現場人員指示進場。</li>
      <li>超過寬限判定遲到，系統會當場改給當天最快的時段，該次仍記為遲到。</li>
      <li>未過刷即列為未到。</li>`}</ol></div>
    <div class="row noprint" style="margin-top:16px"><button class="btn" id="tPrint" style="flex:1">${ic("print",17)}列印</button><button class="btn pri" id="tClose" style="flex:1">關閉</button></div>
  </div></div></div>`;
  drawQR($("#tQr"),pageUrl()+"?id="+encodeURIComponent(b.id),132);
  $("#tClose").onclick=()=>$("#layer").innerHTML="";
  $("#tPrint").onclick=()=>window.print();
  $("#tScrim").onclick=e=>{if(e.target.id==="tScrim")$("#layer").innerHTML=""};
}

/* ── 繪製與綁定 ─────────────────────────────── */
function render(external){
  if(autoNoShow())save();
  const a=document.activeElement;
  const snap=(a&&a.id&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=="date")?{id:a.id,val:a.value,s:a.selectionStart,e:a.selectionEnd}:null;
  const inner=V[view]();
  $("#root").innerHTML=KIOSK.has(view)?inner:shell(inner);
  document.title=(NAV.find(n=>n.v===view)?.t||"")+"｜"+BRAND.sys;
  bind();
  if(snap){
    const el=document.getElementById(snap.id);
    if(el){
      if(external)el.value=snap.val;          // 其他分頁觸發的重繪：保留正在輸入的內容
      el.focus({preventScroll:true});
      try{if(external)el.setSelectionRange(snap.s,snap.e)}catch(e){}
    }
  }
}
function bind(){
  const r=$("#root");
  const on=(sel,ev,fn)=>{const el=$(sel,r);if(el)el[ev]=fn;return el};
  $$("[data-nav]",r).forEach(b=>b.onclick=()=>go(b.dataset.nav));
  $$("[data-newtab]",r).forEach(b=>b.onclick=()=>window.open(urlFor(b.dataset.newtab,KIOSK.has(b.dataset.newtab)?curDc():null),"_blank"));
  $$("[data-adv]",r).forEach(b=>b.onclick=()=>{
    S.simMin+=+b.dataset.adv;
    if(S.simMin>=24*60){S.simMin-=24*60;S.simDate=addDays(S.simDate,1)}
    save();render();
  });
  on("#resetBtn","onclick",()=>{if(!confirm("重設後，所有操作過的預約、報到都會回到初始 Demo 資料。確定嗎？"))return;fresh();U={};render();toast("已重設為初始 Demo 資料")});
  on("#kBack","onclick",()=>go(lastView||"book"));
  on("#kDc","onchange",e=>{kdc=e.target.value;U={};syncUrl();render()});
  $$("[data-copy]",r).forEach(b=>b.onclick=()=>copyText(b.dataset.copy,b.dataset.copy.includes("\n")?b.dataset.copy.split("\n").length+" 張單號":b.dataset.copy));
  $$("[data-ticket]",r).forEach(b=>b.onclick=()=>showTicket(b.dataset.ticket));

  if(view==="book"){
    const doQ=()=>{runSearch($("#q").value);render()};
    on("#qGo","onclick",doQ);
    on("#q","onkeydown",e=>{if(e.key==="Enter")doQ()});
    $$("[data-fill]",r).forEach(b=>b.onclick=()=>{runSearch(b.dataset.fill);render()});
    on("#clear","onclick",()=>{U={};render();$("#q")?.focus()});
    const pl=on("#plateIn","oninput",e=>{
      U.plate=e.target.value.toUpperCase();
      const sp=$("#sumPlate");if(sp)sp.innerHTML=U.plate?`<span class="mono" style="font-weight:600">${esc(U.plate)}</span>`:`<span class="muted">未填</span>`;
    });
    $$("[data-g]",r).forEach(b=>b.onclick=()=>{U.group=b.dataset.g;U.slot=null;U.bookErr="";render()});
    $$(".slot[data-slot]",r).forEach(b=>b.onclick=()=>{U.slot=+b.dataset.slot;U.bookErr="";render()});
    on("#addExtra","onclick",addExtra);
    on("#extraIn","onkeydown",e=>{if(e.key==="Enter"){e.preventDefault();addExtra()}});
    $$("[data-rmextra]",r).forEach(b=>b.onclick=()=>{U.extras=U.extras.filter(x=>x!==b.dataset.rmextra);U.exErr="";render()});
    on("#confirm","onclick",confirmBooking);
    if(!U.mode&&!document.activeElement?.id)$("#q")?.focus({preventScroll:true});
  }
  if(view==="walkin"){
    $$("[data-wg]",r).forEach(b=>b.onclick=()=>{keepDigits("#wDigits",U);U.g=b.dataset.wg;U.slot=null;U.err="";render()});
    $$("[data-wslot]",r).forEach(b=>b.onclick=()=>{keepDigits("#wDigits",U);U.slot=+b.dataset.wslot;U.err="";render()});
    on("#wGo","onclick",()=>{
      keepDigits("#wDigits",U);
      const res=createWalkin(curDc(),U.g||"dock",U.slot,U.digits,"phone");
      if(typeof res==="string"){U.err=res;U.slot=null;render();return}
      U={done:res.id};render();window.scrollTo(0,0);
    });
    on("#wDone","onclick",()=>{U={};render()});
  }
  if(view==="gate"){
    const sc=$("#scan",r);
    if(sc){sc.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();doScan(sc.value)}};
      if(!$("#layer").innerHTML)sc.focus({preventScroll:true})}
    drawQR($("#wkQr",r),urlFor("walkin",curDc()),190);
    on("#guardWalk","onclick",()=>{GW={g:"dock",slot:null,digits:"",err:""};guardWalkModal()});
    on("#simPhone","onclick",()=>window.open(urlFor("walkin",curDc()),"_blank"));
    on("#toBoard","onclick",()=>window.open(urlFor("board",curDc()),"_blank"));
  }
  if(view==="report"){
    $$("[data-tab]",r).forEach(b=>b.onclick=()=>{U={tab:b.dataset.tab,dc:U.dc};render()});
    on("#rDate","onchange",e=>{if(e.target.value){U.date=e.target.value;render()}});
    on("#rDc","onchange",e=>{U.dc=e.target.value;render()});
    on("#rPeriod","onchange",e=>{U.period=e.target.value;render()});
    $$("[data-dshift]",r).forEach(b=>b.onclick=()=>{const n=+b.dataset.dshift;U.date=n?addDays(U.date||S.simDate,n):S.simDate;render()});
    $$("[data-flt]",r).forEach(b=>b.onclick=()=>{U.flt=b.dataset.flt;render()});
    $$("[data-day]",r).forEach(t=>t.onclick=()=>{U={tab:"day",dc:U.dc,date:t.dataset.day};render();window.scrollTo(0,0)});
    on("#exportCsv","onclick",exportCsv);
  }
  if(view==="param"){
    on("#p-grace","onchange",e=>{S.cfg.graceMin=Math.max(0,+e.target.value||0);save();render()});
    on("#p-noshow","onchange",e=>{S.cfg.noShowAfterMin=Math.max(0,+e.target.value||0);save();render()});
    on("#p-walklead","onchange",e=>{S.cfg.walkinLeadMin=Math.max(0,+e.target.value||0);save();render()});
    $$("[data-book]",r).forEach(el=>el.onchange=e=>{
      const[dc,wh]=el.dataset.book.split("|");whOf(dc,wh).booking=e.target.checked;save();render();
      toast(whOf(dc,wh).name+(e.target.checked?" 已開放預約":" 已停止開放預約"));
    });
    $$("[data-cfg]",r).forEach(el=>el.onchange=e=>{
      const[dc,wh,g,f]=el.dataset.cfg.split("|"),p=poolOf(dc,wh,g);
      p[f]=(f==="split"||f==="capacity")?+e.target.value:e.target.value;save();render();
    });
  }
  if(view==="testdata"){
    $$("[data-try]",r).forEach(b=>b.onclick=()=>{view="book";syncUrl();runSearch(b.dataset.try);render();window.scrollTo(0,0)});
  }
}

/* 過刷頁：點畫面空白處也把游標拉回輸入欄，條碼槍隨時可掃。 */
document.addEventListener("click",e=>{
  if(view!=="gate"||$("#layer").innerHTML)return;
  if(e.target.closest("button,select,input,a,label"))return;
  $("#scan")?.focus({preventScroll:true});
});
/* 其他分頁寫入資料時同步重繪（看板、過刷、手機候位互相即時更新）。 */
window.addEventListener("storage",e=>{
  if(e.key!==KEY||!e.newValue)return;
  try{const x=JSON.parse(e.newValue);if(x&&x.v===3){S=x;render(true)}}catch(err){}
});

/* ── 啟動 ── */
load();
(function(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){return}
  const v=q.get("view"); if(v&&V[v])view=v;
  const dc=(q.get("dc")||"").toUpperCase(); if(dc)kdc=dc;
  const id=q.get("id"); if(id){view="book";runSearch(id)}
})();
syncUrl();render();
</script>
</body>
</html>
